<h2>Esperanza Rising: Chapter 13 Quiz</h2>
<p class="meta">November 3, 2026 · Los Duraznos · About 10 minutes</p>

<h3>🧠 Check your understanding</h3>
<div class="q">
<label for="q1">1. Which of these best explains why Isabel losing the Queen of the May title, despite having the best grades, matters so much?</label>
<select id="q1" data-response="q1">
<option value="">Choose...</option>
<option value="a">A. The teacher wanted every student to have a turn.</option>
<option value="b">B. Hard work did not guarantee fair treatment for Mexican children.</option>
<option value="c">C. Grades are never considered in school contests.</option>
<option value="d">D. Isabel did not want the title.</option>
</select>
</div>
<div class="q">
<label for="q2">2. Why is it so unfair that Miguel is replaced at the railroad garage?</label>
<select id="q2" data-response="q2">
<option value="">Choose...</option>
<option value="a">A. He was replaced by workers who would accept lower pay, not because he did poor work.</option>
<option value="b">B. He asked for a vacation during the busiest season.</option>
<option value="c">C. The garage no longer needed any mechanics.</option>
<option value="d">D. He refused to work on Saturdays.</option>
</select>
</div>
<div class="q">
<label for="q3">3. What does the immigration raid on the strikers' camp suggest about the authorities' actions?</label>
<select id="q3" data-response="q3">
<option value="">Choose...</option>
<option value="a">A. They were careful to protect only people without papers.</option>
<option value="b">B. They were trying to help the workers return home safely.</option>
<option value="c">C. They acted unfairly by removing even people who were citizens.</option>
<option value="d">D. They were following the workers' request to leave the camp.</option>
</select>
</div>
<div class="q">
<label for="q4">4. Which statement best expresses a theme of this chapter?</label>
<select id="q4" data-response="q4">
<option value="">Choose...</option>
<option value="a">A. Hard work is always rewarded fairly.</option>
<option value="b">B. Prejudice and unfair treatment can harm families no matter how hard they work.</option>
<option value="c">C. Moving to a new place is always easy.</option>
<option value="d">D. Winning a contest is the most important goal.</option>
</select>
</div>
<div class="q">
<label for="q5">5. In this chapter, Esperanza keeps her belongings in a valise. What is a valise?</label>
<select id="q5" data-response="q5">
<option value="">Choose...</option>
<option value="a">A. A small suitcase</option>
<option value="b">B. A kind of sewing kit</option>
<option value="c">C. A wooden trunk for a wagon</option>
<option value="d">D. A bag of gifts</option>
</select>
