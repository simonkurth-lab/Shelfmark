<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelfmark — Reading Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=optional" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --ink:#2B2118; --forest:#2F5D50; --forest-dark:#1F423A;
    --coral:#E8734A; --gold:#D9A441; --card:#FFFFFF; --line:#E7DFCE; --muted:#7A7160;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;padding:20px 18px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--forest),var(--forest-dark));display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Baloo 2';font-weight:800;font-size:16px;}
  .brand-name{font-size:20px;color:var(--forest-dark);}
  .who{font-size:13px;color:var(--muted);font-weight:700;}
  .who button{background:none;border:none;color:var(--coral);font-weight:800;cursor:pointer;padding:0;margin-left:6px;font-family:inherit;font-size:13px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(43,33,24,0.04);}
  input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:'Nunito';font-size:16px;font-weight:600;color:var(--ink);background:#fff;}
  input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--forest);outline-offset:1px;}
  input.pin-input{letter-spacing:8px;font-size:22px;text-align:center;font-weight:800;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--forest);color:#fff;border:none;border-radius:10px;padding:13px 20px;font-family:'Nunito';font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:12px;}
  .btn:hover{background:var(--forest-dark);}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .btn.secondary{background:transparent;color:var(--forest-dark);border:1.5px solid var(--forest-dark);}
  .btn.coral{background:var(--coral);}
  .btn.coral:hover{background:#cf5f38;}
  .btn[disabled]{opacity:0.55;cursor:not-allowed;}
  .btn.name-pick{background:#F6F1E4;color:var(--forest-dark);border:1.5px solid var(--line);margin-top:8px;display:flex;justify-content:space-between;align-items:center;text-align:left;}
  .btn.name-pick:hover{background:#EFEAD9;}
  .btn.name-pick .np-pts{font-size:12px;font-weight:800;color:var(--muted);}
  .muted{color:var(--muted);font-size:13.5px;}
  .error-text{color:var(--coral);font-size:13.5px;font-weight:700;margin:8px 0 0;}
  .book-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .book-row:last-child{border-bottom:none;}
  .book-row:hover{background:#faf8f2;}
  .cover{width:48px;height:68px;border-radius:5px;background:var(--line);flex:none;object-fit:cover;}
  .book-title{font-weight:800;font-size:15px;}
  .book-author{font-size:13px;color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:#EFEAD9;color:var(--forest-dark);margin-top:4px;margin-right:6px;}
  .pill.gold{background:#FBF0DA;color:#8A6412;}
  .stat-row{display:flex;gap:10px;margin:14px 0;}
  .stat{flex:1;background:#F6F1E4;border-radius:12px;padding:12px;text-align:center;}
  .stat .num{font-family:'Baloo 2';font-size:20px;color:var(--forest-dark);}
  .stat .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .quiz-q{margin-bottom:18px;}
  .quiz-q .qtext{font-weight:800;margin-bottom:10px;font-size:15.5px;}
  .opt{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px;cursor:pointer;font-family:'Nunito';font-weight:600;font-size:14.5px;color:var(--ink);}
  .opt.selected{border-color:var(--forest);background:#EEF4F1;}
  .loading{text-align:center;padding:30px 0;color:var(--muted);font-weight:700;}
  .loading::before{content:'';display:block;width:34px;height:34px;margin:0 auto 14px;border:4px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .backlink{background:none;border:none;color:var(--forest-dark);font-weight:800;font-size:14px;cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit;}
  .empty{text-align:center;padding:40px 10px;color:var(--muted);}
  .history-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .history-row:last-child{border-bottom:none;}
  .score-badge{font-weight:800;}
  .score-badge.good{color:var(--forest-dark);}
  .score-badge.low{color:var(--coral);}
  .footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.5;}
  .roster-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
  .roster-row:last-child{border-bottom:none;}
  .divider{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
  .setup-label{font-weight:800;font-size:14.5px;margin:0 0 4px;}
  .setup-sub{margin:0 0 12px;}
  .choice-row{display:flex;gap:8px;margin-bottom:20px;}
  .choice-btn{flex:1;text-align:center;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:'Nunito';color:var(--ink);}
  .choice-btn .cb-main{font-family:'Baloo 2';font-weight:700;font-size:16px;display:block;}
  .choice-btn .cb-sub{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-top:2px;}
  .choice-btn.selected{border-color:var(--forest);background:#EEF4F1;}
  .choice-btn.selected .cb-sub{color:var(--forest-dark);}
  .choice-col{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .conf-btn{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:'Nunito';display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .conf-btn.selected{border-color:var(--coral);background:#FDF2ED;}
  .conf-main{font-weight:800;font-size:14.5px;color:var(--ink);}
  .conf-sub{font-size:12px;color:var(--muted);font-weight:600;}
  .mult-tag{flex:none;font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--gold);background:#FBF0DA;padding:3px 9px;border-radius:20px;}
  .conf-btn.selected .mult-tag{background:var(--coral);color:#fff;}
  .points-banner{background:linear-gradient(135deg,var(--gold),#E8B84D);color:#4A3300;border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;}
  .points-banner .pb-num{font-family:'Baloo 2';font-weight:800;font-size:28px;}
  .points-banner .pb-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;}
  .points-pill{display:inline-block;background:#FBF0DA;color:#8A6412;font-weight:800;font-size:12px;padding:2px 9px;border-radius:20px;}
  .goal-block{margin-bottom:16px;}
  .goal-block:last-child{margin-bottom:0;}
  .goal-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--forest-dark);margin-bottom:6px;}
  .goal-track{height:10px;border-radius:20px;background:#F0EBDC;overflow:hidden;}
  .goal-fill{height:100%;border-radius:20px;transition:width .4s ease;}
  .goal-fill.points{background:var(--coral);}
  .goal-fill.words{background:var(--forest);}
  .already-done{background:#EEF4F1;border-radius:12px;padding:14px 16px;margin-top:14px;}
  .already-done-title{font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--forest-dark);}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
  .badge-chip{background:var(--forest);color:#fff;font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:20px;animation:pop .35s cubic-bezier(.3,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:9999;}
  .bilingual-pair{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:2px;align-items:baseline;}
  .bilingual-pair .es{color:var(--muted);font-style:italic;font-weight:600;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Point this at your Cloudflare Worker
const WORKER_URL = 'https://shelfmark-api.simonkurth.workers.dev';

const STATE = {
  screen: 'login', alias: null, student: null,
  roster: [], rosterLoaded: false,
  loginMode: 'pick', pendingAlias: null, loginError: '',
  signupAlias: '', signupPin: '', signupGrade: '35',
  teacherPasscode: '', teacherError: '', teacherAuthed: false, teacherRows: null,
  searchResults: [], searchQuery: '', currentBook: null,
  quiz: null, quizAnswers: {}, loading: false, loadingMsg: '',
  quizSetup: { count: 7, confidence: 'medium', challenge: 'onlevel', bilingual: 0 },
  resultAnimated: false,
};

// ---------- Points system ----------
const QUIZ_LENGTHS = [5, 7, 10];
const LENGTH_BONUS = { 5: 0, 7: 5, 10: 10 };
const GRADE_BANDS = {
  k2:  { label: 'K-2',   sub: 'Ages 5-8' },
  '35': { label: '3-5',  sub: 'Ages 8-11' },
  '68': { label: '6-8',  sub: 'Ages 11-14' },
  '912': { label: '9-12', sub: 'Ages 14-18' },
};
const CHALLENGE = {
  easier:  { label: 'Easier',    sub: 'Simpler wording' },
  onlevel: { label: 'Just right', sub: 'Matches my grade' },
  harder:  { label: 'Harder',    sub: 'Push me a bit' },
};
const BILINGUAL_CHOICES = {
  0: { label: 'English only', sub: 'Default' },
  1: { label: 'English + Español', sub: 'Shown together' },
};
const CONFIDENCE = {
  low:    { label: 'Not sure',        sub: "Haven't read it closely, or it's been a while", mult: 1   },
  medium: { label: 'Pretty sure',     sub: 'I remember most of the story',                  mult: 1.5 },
  high:   { label: 'Know it well',    sub: "I could retell the whole book",                 mult: 2   },
};
const POINTS_PER_CORRECT = 10;
const PENALTY_PER_WRONG = 3;
const POINT_MILESTONES = [50, 100, 250, 500, 1000, 2000];
const STREAK_MILESTONES = [3, 5, 10, 20];

const MASTERY_PCT = 0.8;
function meetsMastery(correct, total){
  return correct >= Math.ceil(total * MASTERY_PCT);
}

function computeQuizPoints(correct, total, confidenceKey, count){
  if(!meetsMastery(correct, total)) return 0;
  const mult = (CONFIDENCE[confidenceKey] || CONFIDENCE.medium).mult;
  const wrong = total - correct;
  const raw = correct * POINTS_PER_CORRECT * mult - wrong * PENALTY_PER_WRONG * mult;
  return Math.max(0, Math.round(raw)) + (LENGTH_BONUS[count] || 0);
}

function lengthTag(pages){
  if(!pages) return null;
  if(pages < 150) return 'Quick read';
  if(pages <= 320) return 'Standard length';
  return 'Chunky read';
}

const TESTING_START_MIN = 7*60 + 40;  // 7:40 AM
const TESTING_END_MIN = 14*60 + 40;   // 2:40 PM
function isTestingHours(){
  if(new URLSearchParams(location.search).get('preview') === '1') return true; // teacher testing bypass
  const now = new Date();
  const minutes = now.getHours()*60 + now.getMinutes();
  return minutes >= TESTING_START_MIN && minutes <= TESTING_END_MIN;
}

function findPriorAttempt(history, book){
  return (history||[]).find(h =>
    (book.olid && h.olid && h.olid === book.olid) ||
    (h.title||'').trim().toLowerCase() === (book.title||'').trim().toLowerCase()
  );
}

function currentStreak(history){
  let streak = 0;
  for(const h of history){ if(h.points>0) streak++; else break; }
  return streak;
}

// Shared rank ladder, framed as a climb up Mount Everest: reachable via points
// (rewards quiz performance/volume) OR words read (rewards tackling longer
// books) - whichever a student hits first. 1,000,000 words is the summit -
// many smaller checkpoints lead up to it so progress always feels close.
const RANKS = [
  { name: 'Page Turner',          emoji: '📖', points: 0,    words: 0 },
  { name: 'Bookworm',             emoji: '🐛', points: 20,   words: 3000 },
  { name: 'Story Chaser',         emoji: '🏃', points: 50,   words: 8000 },
  { name: 'Trailblazer',          emoji: '🥾', points: 90,   words: 15000 },
  { name: 'Base Camp',            emoji: '⛺', points: 150,  words: 25000 },
  { name: 'Climber',              emoji: '🧗', points: 240,  words: 40000 },
  { name: 'Chapter Champion',     emoji: '⭐', points: 350,  words: 60000 },
  { name: 'Camp One',             emoji: '🏔️', points: 550,  words: 90000 },
  { name: 'Camp Two',             emoji: '🏔️', points: 800,  words: 130000 },
  { name: 'High Camp',            emoji: '❄️', points: 1100, words: 180000 },
  { name: 'Legend of the Library',emoji: '🏛️', points: 1500, words: 250000 },
  { name: 'Summit Push',          emoji: '🚵', points: 2100, words: 350000 },
  { name: 'Shelfmark Master',     emoji: '👑', points: 3000, words: 500000 },
  { name: 'Everest Approach',     emoji: '🌄', points: 4200, words: 700000 },
  { name: 'Summit of Everest',    emoji: '🏆', points: 6000, words: 1000000 },
];

function getRankInfo(points, words){
  points = points||0; words = words||0;
  let rankIdx = 0;
  for(let i=0;i<RANKS.length;i++){
    if(points >= RANKS[i].points || words >= RANKS[i].words) rankIdx = i;
  }
  const current = RANKS[rankIdx];
  const next = RANKS[rankIdx+1] || null;
  let pointsPct = 100, wordsPct = 100;
  if(next){
    pointsPct = Math.min(100, Math.round(((points - current.points) / (next.points - current.points)) * 100));
    wordsPct = Math.min(100, Math.round(((words - current.words) / (next.words - current.words)) * 100));
  }
  return { rankIdx, current, next, pointsPct: Math.max(0,pointsPct), wordsPct: Math.max(0,wordsPct) };
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function render(){ document.getElementById('app').innerHTML=''; document.getElementById('app').appendChild(buildScreen()); }

async function api(path, opts){
  const res = await fetch(WORKER_URL + path, opts);
  return res.json();
}
function postJSON(path, body){
  return api(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
}

async function loadRoster(){
  return api('/api/roster');
}
async function saveStudent(alias, data){
  await postJSON('/api/student/' + encodeURIComponent(alias), data);
}

// ---------- Screens ----------

function buildScreen(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(topbar());
  let body;
  if(STATE.screen==='login') body = screenLogin();
  else if(STATE.screen==='home') body = screenHome();
  else if(STATE.screen==='search') body = screenSearch();
  else if(STATE.screen==='book') body = screenBook();
  else if(STATE.screen==='quizSetup') body = screenQuizSetup();
  else if(STATE.screen==='quiz') body = screenQuiz();
  else if(STATE.screen==='result') body = screenResult();
  else if(STATE.screen==='dashboard') body = screenDashboard();
  else if(STATE.screen==='teacher') body = screenTeacher();
  wrap.appendChild(body);
  if(STATE.screen!=='login'){
    const note = el(`<div class="footer-note">Everyone here goes by an alias, not their real name. Ask your teacher if you forget your PIN.</div>`);
    wrap.appendChild(note);
  }
  return wrap;
}

function topbar(){
  const bar = el(`<div class="topbar"></div>`);
  const brand = el(`<a href="index.html" class="brand" style="text-decoration:none;color:inherit;cursor:pointer;"><div class="mark">S</div><div class="brand-name">Shelfmark</div></a>`);
  bar.appendChild(brand);
  if(STATE.alias){
    const who = el(`<div class="who">${STATE.alias} <button id="switchBtn">switch</button></div>`);
    who.querySelector('#switchBtn').onclick = ()=>{ logout(); };
    bar.appendChild(who);
  }
  return bar;
}

function logout(){
  STATE.screen='login'; STATE.alias=null; STATE.student=null; STATE.rosterLoaded=false;
  STATE.loginMode='pick'; STATE.pendingAlias=null; STATE.loginError='';
  render();
}

function screenLogin(){
  if(STATE.loginMode==='pin') return screenLoginPin();
  if(STATE.loginMode==='signup') return screenSignup();

  const c = el(`<div><a href="index.html" class="backlink" style="text-decoration:none;display:inline-block;">&larr; Back to home</a><div class="card"><h2 style="margin-bottom:6px;">Who's reading?</h2><p class="muted" style="margin:0 0 14px;">Pick your alias below.</p><div id="names"></div><div class="divider">New here?</div><button class="btn secondary" id="newBtn">Create an alias</button><button class="btn secondary" id="teacherBtn">Teacher dashboard</button></div></div>`);
  const namesDiv = c.querySelector('#names');
  if(!STATE.rosterLoaded){
    namesDiv.innerHTML = `<div class="loading">Loading class list...</div>`;
    loadRoster().then(list=>{ STATE.roster = list || []; STATE.rosterLoaded = true; render(); });
  } else if(STATE.roster.length){
    STATE.roster.forEach(s=>{
      const b = el(`<button class="btn name-pick"><span>${s.alias}</span><span class="np-pts">${s.points||0} pts</span></button>`);
      b.onclick = ()=>{ STATE.loginMode='pin'; STATE.pendingAlias=s.alias; STATE.loginError=''; render(); };
      namesDiv.appendChild(b);
    });
  } else {
    namesDiv.innerHTML = `<div class="empty">No aliases yet — be the first!</div>`;
  }
  c.querySelector('#newBtn').onclick = ()=>{ STATE.loginMode='signup'; STATE.signupAlias=''; STATE.signupPin=''; STATE.loginError=''; render(); };
  c.querySelector('#teacherBtn').onclick = ()=>{ STATE.screen='teacher'; render(); };
  return c;
}

function screenLoginPin(){
  const c = el(`<div class="card"><button class="backlink" id="back">&larr; Back</button><h2 style="margin-bottom:6px;">Hi, ${STATE.pendingAlias}</h2><p class="muted" style="margin:0 0 14px;">Enter your 4-digit PIN.</p><input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="pin-input" id="pinInput" placeholder="••••" /><button class="btn" id="goBtn">Log in</button><div id="err"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.loginMode='pick'; render(); };
  const pinInput = c.querySelector('#pinInput');
  const tryLogin = ()=> doLogin(STATE.pendingAlias, pinInput.value);
  pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  c.querySelector('#goBtn').onclick = tryLogin;
  if(STATE.loginError) c.querySelector('#err').appendChild(el(`<p class="error-text">${STATE.loginError}</p>`));
  setTimeout(()=>pinInput.focus(), 0);
  return c;
}

function screenSignup(){
  const c = el(`<div class="card"><button class="backlink" id="back">&larr; Back</button><h2 style="margin-bottom:6px;">Create your alias</h2><p class="muted" style="margin:0 0 14px;">Pick a nickname (not your real name) and a 4-digit PIN you'll remember. Your teacher can look up your PIN if you forget it.</p><input type="text" id="aliasInput" placeholder="Choose an alias" maxlength="24" value="${STATE.signupAlias.replace(/"/g,'')}" /><br><br><input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="pin-input" id="pinInput" placeholder="••••" value="${STATE.signupPin.replace(/"/g,'')}" /><p class="setup-label" style="margin-top:18px;">What grade are you in?</p><p class="muted setup-sub">This helps us write quizzes at the right level for you.</p><div class="choice-row" id="gradeRow"></div><button class="btn coral" id="goBtn">Create account</button><div id="err"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.loginMode='pick'; render(); };
  const aliasInput = c.querySelector('#aliasInput');
  const pinInput = c.querySelector('#pinInput');
  aliasInput.addEventListener('input', ()=>{ STATE.signupAlias = aliasInput.value; });
  pinInput.addEventListener('input', ()=>{ STATE.signupPin = pinInput.value; });
  const gradeRow = c.querySelector('#gradeRow');
  Object.keys(GRADE_BANDS).forEach(key=>{
    const g = GRADE_BANDS[key];
    const btn = el(`<button type="button" class="choice-btn ${STATE.signupGrade===key?'selected':''}"><span class="cb-main">${g.label}</span><span class="cb-sub">${g.sub}</span></button>`);
    btn.onclick = ()=>{ STATE.signupGrade = key; render(); };
    gradeRow.appendChild(btn);
  });
  const trySignup = ()=> doSignup(aliasInput.value, pinInput.value);
  pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') trySignup(); });
  c.querySelector('#goBtn').onclick = trySignup;
  if(STATE.loginError) c.querySelector('#err').appendChild(el(`<p class="error-text">${STATE.loginError}</p>`));
  return c;
}

async function doSignup(alias, pin){
  alias = (alias||'').trim();
  if(!alias){ STATE.loginError='Pick an alias first.'; render(); return; }
  if(!/^\d{4}$/.test(pin||'')){ STATE.loginError='PIN must be exactly 4 digits.'; render(); return; }
  STATE.loading=true; STATE.loadingMsg='Setting up your shelf...'; render();
  const resp = await postJSON('/api/signup', { alias, pin, grade: STATE.signupGrade });
  STATE.loading=false;
  if(resp.error==='alias_taken'){ STATE.loginError='That alias is taken — try another.'; render(); return; }
  if(resp.error){ STATE.loginError='Something went wrong. Try again.'; render(); return; }
  STATE.alias = resp.alias;
  STATE.student = resp;
  STATE.rosterLoaded = false;
  STATE.screen = 'home';
  render();
}

async function doLogin(alias, pin){
  if(!/^\d{4}$/.test(pin||'')){ STATE.loginError='Enter your 4-digit PIN.'; render(); return; }
  STATE.loading=true; STATE.loadingMsg='Loading your bookshelf...'; render();
  const resp = await postJSON('/api/login', { alias, pin });
  STATE.loading=false;
  if(resp.error==='wrong_pin'){ STATE.loginError='Wrong PIN — try again.'; render(); return; }
  if(resp.error){ STATE.loginError='Could not find that alias.'; render(); return; }
  STATE.alias = resp.alias;
  STATE.student = resp;
  STATE.screen = 'home';
  render();
}

function screenHome(){
  if(STATE.loading) return el(`<div class="loading">${STATE.loadingMsg}</div>`);
  const s = STATE.student;
  const rank = getRankInfo(s.points, s.wordsRead);
  const c = el(`<div><a href="index.html" class="backlink" style="text-decoration:none;display:inline-block;">&larr; Back to home</a><div class="card"><h2>Hi ${s.alias} 👋</h2><div class="pill gold" style="margin-top:6px;">${rank.current.emoji} ${rank.current.name}</div><div class="stat-row"><div class="stat"><div class="num">${s.points||0}</div><div class="lbl">Points</div></div><div class="stat"><div class="num">${s.history.length}</div><div class="lbl">Books Finished</div></div><div class="stat"><div class="num">${currentStreak(s.history)}</div><div class="lbl">Streak</div></div></div><button class="btn" id="searchBtn">Find a book</button><button class="btn secondary" id="dashBtn">My progress</button></div></div>`);
  c.querySelector('#searchBtn').onclick = ()=>{ STATE.screen='search'; render(); };
  c.querySelector('#dashBtn').onclick = ()=>{ STATE.screen='dashboard'; render(); };
  return c;
}

function screenSearch(){
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2 style="margin-bottom:10px;">Find a book</h2><input type="text" id="q" placeholder="Title or author..." value="${STATE.searchQuery.replace(/"/g,'')}" /><button class="btn" id="searchGo">Search</button></div><div class="card" id="results"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='home'; render(); };
  c.querySelector('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') runSearch(); });
  c.querySelector('#searchGo').onclick = runSearch;
  const resultsDiv = c.querySelector('#results');
  if(STATE.loading){ resultsDiv.innerHTML = `<div class="loading">${STATE.loadingMsg}</div>`; }
  else if(STATE.searchResults.length===0 && STATE.searchQuery){ resultsDiv.innerHTML = `<div class="empty">No books found. Try a different spelling.</div>`; }
  else if(STATE.searchResults.length===0){ resultsDiv.innerHTML = `<div class="empty">Search for a title or author to get started.</div>`; }
  else {
    STATE.searchResults.forEach(b=>{
      const row = el(`<div class="book-row">${b.cover_i ? `<img class="cover" src="https://covers.openlibrary.org/b/id/${b.cover_i}-S.jpg">` : `<div class="cover"></div>`}<div><div class="book-title">${b.title}</div><div class="book-author">${(b.author_name||['Unknown']).join(', ')}</div></div></div>`);
      row.onclick = ()=> openBook(b);
      resultsDiv.appendChild(row);
    });
  }
  return c;
}

async function runSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  STATE.searchQuery = q;
  STATE.loading = true; STATE.loadingMsg='Searching...'; render();
  try{
    const resp = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=title,author_name,key,number_of_pages_median,first_publish_year,cover_i&limit=10`);
    const data = await resp.json();
    STATE.searchResults = (data.docs||[]).filter(d=>d.title).slice(0,8);
  }catch(e){ STATE.searchResults = []; }
  STATE.loading = false;
  render();
}

async function openBook(b){
  STATE.loading = true; STATE.loadingMsg = 'Reading up on this book...'; render();
  const olid = b.key.replace('/works/','');
  let description = '';
  try{
    const workResp = await fetch(`https://openlibrary.org${b.key}.json`);
    const work = await workResp.json();
    description = typeof work.description === 'string' ? work.description : (work.description && work.description.value) || '';
  }catch(e){}

  const pages = b.number_of_pages_median || null;

  const meta = await api('/api/book-meta', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ olid, title: b.title, author: (b.author_name||['Unknown']).join(', '), year: b.first_publish_year, description })
  });

  STATE.currentBook = {
    title: b.title, author: (b.author_name||['Unknown']).join(', '),
    pages, wordEstimate: meta.estimatedWordCount || null, summary: meta.summary, genre: meta.genre,
    olid
  };
  STATE.loading = false;
  STATE.screen = 'book';
  render();
}

function screenBook(){
  if(STATE.loading) return el(`<div class="loading">${STATE.loadingMsg}</div>`);
  const b = STATE.currentBook;
  const tag = lengthTag(b.pages);
  const prior = findPriorAttempt(STATE.student.history, b);
  const actionHtml = prior
    ? `<div class="already-done"><div class="already-done-title">✅ Already completed</div><p class="muted" style="margin:4px 0 0;">You scored ${prior.score}% and earned ${prior.points!=null ? '+'+prior.points+' pts' : ''} on ${prior.date}. Each book can only be quizzed once — go find something new!</p></div><button class="btn secondary" id="anotherBtn">Find another book</button>`
    : !isTestingHours()
    ? `<div class="already-done"><div class="already-done-title">⏰ Quizzes aren't open right now</div><p class="muted" style="margin:4px 0 0;">Quizzes can only be taken between 7:40 AM and 2:40 PM. Come back during that window to take yours.</p></div>`
    : `<button class="btn coral" id="quizBtn">I finished it — take the quiz</button>`;
  const c = el(`<div><button class="backlink" id="back">&larr; Back to search</button><div class="card"><h2>${b.title}</h2><p class="muted" style="margin:2px 0 10px;">${b.author}</p>${tag ? `<span class="pill">${tag}</span>` : ''}<span class="pill gold">${b.genre||'Fiction'}</span><div class="stat-row"><div class="stat"><div class="num">${b.wordEstimate ? b.wordEstimate.toLocaleString() : '—'}</div><div class="lbl">Est. Words</div></div><div class="stat"><div class="num">${b.pages || '—'}</div><div class="lbl">Pages</div></div></div><p style="line-height:1.5;">${b.summary}</p>${actionHtml}</div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='search'; render(); };
  const quizBtn = c.querySelector('#quizBtn');
  if(quizBtn) quizBtn.onclick = ()=>{ STATE.screen='quizSetup'; render(); };
  const anotherBtn = c.querySelector('#anotherBtn');
  if(anotherBtn) anotherBtn.onclick = ()=>{ STATE.screen='search'; STATE.searchResults=[]; STATE.searchQuery=''; render(); };
  return c;
}

function screenQuizSetup(){
  const b = STATE.currentBook;
  const setup = STATE.quizSetup;
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2 style="margin-bottom:4px;">${b.title}</h2><p class="muted" style="margin:0 0 18px;">Set up your quiz before you start.</p>
    <p class="setup-label">How many questions?</p>
    <p class="muted setup-sub">Longer quizzes are worth bonus points.</p>
    <div class="choice-row" id="lengthRow"></div>
    <p class="setup-label">How much of a challenge do you want?</p>
    <p class="muted setup-sub">We'll write the quiz to match.</p>
    <div class="choice-row" id="challengeRow"></div>
    <p class="setup-label">How well do you know this book?</p>
    <p class="muted setup-sub">Higher confidence = bigger point swings, up or down.</p>
    <div class="choice-col" id="confCol"></div>
    <p class="setup-label">Quiz language</p>
    <p class="muted setup-sub">Optional — show English and Spanish together for every question.</p>
    <div class="choice-row" id="langRow"></div>
    <button class="btn coral" id="startBtn">Start quiz</button>
  </div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='book'; render(); };

  const lengthRow = c.querySelector('#lengthRow');
  QUIZ_LENGTHS.forEach(n=>{
    const bonus = LENGTH_BONUS[n];
    const btn = el(`<button type="button" class="choice-btn ${setup.count===n?'selected':''}"><span class="cb-main">${n}</span><span class="cb-sub">${bonus ? '+'+bonus+' bonus' : 'Quick'}</span></button>`);
    btn.onclick = ()=>{ STATE.quizSetup.count = n; render(); };
    lengthRow.appendChild(btn);
  });

  const challengeRow = c.querySelector('#challengeRow');
  Object.keys(CHALLENGE).forEach(key=>{
    const ch = CHALLENGE[key];
    const btn = el(`<button type="button" class="choice-btn ${setup.challenge===key?'selected':''}"><span class="cb-main">${ch.label}</span><span class="cb-sub">${ch.sub}</span></button>`);
    btn.onclick = ()=>{ STATE.quizSetup.challenge = key; render(); };
    challengeRow.appendChild(btn);
  });

  const confCol = c.querySelector('#confCol');
  Object.keys(CONFIDENCE).forEach(key=>{
    const conf = CONFIDENCE[key];
    const btn = el(`<button type="button" class="conf-btn ${setup.confidence===key?'selected':''}"><span><span class="conf-main">${conf.label}</span><br><span class="conf-sub">${conf.sub}</span></span><span class="mult-tag">${conf.mult}x</span></button>`);
    btn.onclick = ()=>{ STATE.quizSetup.confidence = key; render(); };
    confCol.appendChild(btn);
  });

  const langRow = c.querySelector('#langRow');
  Object.keys(BILINGUAL_CHOICES).forEach(key=>{
    const l = BILINGUAL_CHOICES[key];
    const val = Number(key);
    const btn = el(`<button type="button" class="choice-btn ${setup.bilingual===val?'selected':''}"><span class="cb-main">${l.label}</span><span class="cb-sub">${l.sub}</span></button>`);
    btn.onclick = ()=>{ STATE.quizSetup.bilingual = val; render(); };
    langRow.appendChild(btn);
  });

  c.querySelector('#startBtn').onclick = startQuiz;
  return c;
}

async function startQuiz(){
  if(!isTestingHours()){ STATE.screen='book'; render(); return; }
  STATE.loading = true; STATE.loadingMsg = 'Writing your quiz...'; render();
  const b = STATE.currentBook;
  const count = STATE.quizSetup.count;
  const grade = STATE.student.grade || '35';
  const challenge = STATE.quizSetup.challenge;
  const bilingual = !!STATE.quizSetup.bilingual;
  const quiz = await api('/api/quiz', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ olid: b.olid, title: b.title, author: b.author, summary: b.summary, count, grade, challenge, bilingual })
  });
  STATE.quiz = quiz;
  STATE.quizAnswers = {};
  STATE.loading = false;
  STATE.screen = 'quiz';
  render();
}

function screenQuiz(){
  if(STATE.loading) return el(`<div class="loading">${STATE.loadingMsg}</div>`);
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2 style="margin-bottom:14px;">Quick check: ${STATE.currentBook.title}</h2><div id="qs"></div><button class="btn" id="submitBtn">Submit answers</button></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='book'; render(); };
  const qs = c.querySelector('#qs');
  STATE.quiz.questions.forEach((q,qi)=>{
    const qText = q.q_es
      ? `<div class="bilingual-pair"><span>${qi+1}. ${q.q}</span><span class="es">${q.q_es}</span></div>`
      : `${qi+1}. ${q.q}`;
    const qDiv = el(`<div class="quiz-q"><div class="qtext">${qText}</div></div>`);
    q.options.forEach((opt,oi)=>{
      const optEs = q.options_es && q.options_es[oi];
      const optHtml = optEs
        ? `<div class="bilingual-pair"><span>${opt}</span><span class="es">${optEs}</span></div>`
        : opt;
      const optEl = el(`<button type="button" class="opt">${optHtml}</button>`);
      if(STATE.quizAnswers[qi]===oi) optEl.classList.add('selected');
      optEl.onclick = ()=>{ STATE.quizAnswers[qi]=oi; render(); };
      qDiv.appendChild(optEl);
    });
    qs.appendChild(qDiv);
  });
  const submitBtn = c.querySelector('#submitBtn');
  const allAnswered = Object.keys(STATE.quizAnswers).length === STATE.quiz.questions.length;
  if(!allAnswered) submitBtn.setAttribute('disabled','true');
  submitBtn.onclick = submitQuiz;
  return c;
}

function computeBadges(s, r, prevPoints, prevWords, prevRankIdx){
  const badges = [];
  if(s.history.length === 1) badges.push({emoji:'🌱', label:'First Book!'});
  if(r.pct === 100) badges.push({emoji:'💯', label:'Perfect Score'});
  const streak = currentStreak(s.history);
  if(STREAK_MILESTONES.includes(streak)) badges.push({emoji:'🔥', label: streak+'-Book Streak'});
  POINT_MILESTONES.forEach(m=>{ if(prevPoints < m && s.points >= m) badges.push({emoji:'🏆', label: m+' Points!'}); });
  const newRank = getRankInfo(s.points, s.wordsRead);
  if(newRank.rankIdx > prevRankIdx) badges.push({emoji:newRank.current.emoji, label:'Rank Up: '+newRank.current.name+'!'});
  return badges;
}

async function submitQuiz(){
  const qs = STATE.quiz.questions;
  let correct = 0;
  qs.forEach((q,qi)=>{ if(STATE.quizAnswers[qi]===q.correctIndex) correct++; });
  const pct = Math.round((correct/qs.length)*100);

  const b = STATE.currentBook;
  const s = STATE.student;
  const confidence = STATE.quizSetup.confidence;
  const count = STATE.quizSetup.count;
  const earnedPoints = computeQuizPoints(correct, qs.length, confidence, count);
  const prevPoints = s.points||0;
  const prevWords = s.wordsRead||0;
  const prevRankIdx = getRankInfo(prevPoints, prevWords).rankIdx;

  s.history.unshift({ title:b.title, olid:b.olid, score:pct, date:new Date().toISOString().slice(0,10), points:earnedPoints, count, confidence, words:b.wordEstimate||0 });
  s.points = prevPoints + earnedPoints;
  s.wordsRead = prevWords + (b.wordEstimate||0);
  await saveStudent(s.alias, s);

  const result = { correct, total: qs.length, pct, earnedPoints, totalPoints: s.points, confidence };
  result.badges = computeBadges(s, result, prevPoints, prevWords, prevRankIdx);

  STATE.quizResult = result;
  STATE.resultAnimated = false;
  STATE.screen = 'result';
  render();
}

const CELEBRATE_GOOD = ['Nice reading! 🎉','You crushed it! 🌟','Book conquered! 📚','Reading champion! 🏆','Way to go, reader! ✨'];
const CELEBRATE_OK = ['Good try! 💪','Nice effort! 👍','Keep it up! 🙂','Solid work! 📖'];

function animateNumber(node, to, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    node.textContent = '+' + Math.round(eased*to);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function fireConfetti(){
  const colors = ['#E8734A','#D9A441','#2F5D50','#7A9E8C','#8A6412'];
  for(let i=0;i<32;i++){
    const p = document.createElement('div');
    const size = 6+Math.random()*6;
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'vw';
    p.style.width = size+'px';
    p.style.height = (size*0.4)+'px';
    p.style.background = colors[i%colors.length];
    p.style.opacity = '0.9';
    p.style.borderRadius = '2px';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    p.style.transition = 'top 1.6s cubic-bezier(.2,.6,.3,1), transform 1.6s cubic-bezier(.2,.6,.3,1), opacity 1.6s';
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.top = (65+Math.random()*30)+'vh';
      p.style.transform = `translateX(${(Math.random()-0.5)*180}px) rotate(${360+Math.random()*720}deg)`;
      p.style.opacity = '0';
    });
    setTimeout(()=>p.remove(), 1700);
  }
}

function screenResult(){
  const r = STATE.quizResult;
  const good = meetsMastery(r.correct, r.total);
  const mult = (CONFIDENCE[r.confidence] || CONFIDENCE.medium).mult;
  const headline = (good ? CELEBRATE_GOOD : CELEBRATE_OK)[Math.floor(Math.random()*(good?CELEBRATE_GOOD:CELEBRATE_OK).length)];
  const masteryNote = !good ? `<p class="muted" style="margin:0 0 14px;">Quizzes need 80% or higher to earn points — this one still counts as finished, just no points this time.</p>` : '';
  const c = el(`<div class="card" style="text-align:center;"><h2>${headline}</h2><p class="muted" style="margin:6px 0 16px;">${r.correct} of ${r.total} correct</p>${masteryNote}${r.badges.length ? `<div class="badge-row">${r.badges.map(b=>`<span class="badge-chip">${b.emoji} ${b.label}</span>`).join('')}</div>` : ''}<div class="points-banner"><div class="pb-num">+0</div><div class="pb-lbl">Points earned · ${mult}x confidence</div></div><div class="stat-row"><div class="stat"><div class="num">${r.pct}%</div><div class="lbl">Score</div></div><div class="stat"><div class="num">${r.totalPoints}</div><div class="lbl">Total Points</div></div></div><button class="btn" id="nextBtn">Find another book</button><button class="btn secondary" id="dashBtn">See my progress</button></div>`);
  c.querySelector('#nextBtn').onclick = ()=>{ STATE.screen='search'; STATE.searchResults=[]; STATE.searchQuery=''; render(); };
  c.querySelector('#dashBtn').onclick = ()=>{ STATE.screen='dashboard'; render(); };
  if(!STATE.resultAnimated){
    STATE.resultAnimated = true;
    setTimeout(()=>{
      const numEl = document.querySelector('.pb-num');
      if(numEl) animateNumber(numEl, r.earnedPoints, 800);
      fireConfetti();
    }, 30);
  }
  return c;
}

function screenDashboard(){
  const s = STATE.student;
  const words = s.wordsRead||0;
  const rank = getRankInfo(s.points, words);
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2>${s.alias}'s bookshelf</h2><p class="muted" style="margin:4px 0 0;"><span class="points-pill">${s.points||0} pts</span></p><div class="stat-row"><div class="stat"><div class="num">${s.history.length}</div><div class="lbl">Books Finished</div></div><div class="stat"><div class="num">${words.toLocaleString()}</div><div class="lbl">Words Read</div></div><div class="stat"><div class="num">${currentStreak(s.history)}</div><div class="lbl">Current Streak</div></div></div></div>
  <div class="card">
    <h3 style="margin-bottom:2px;">${rank.current.emoji} ${rank.current.name}</h3>
    ${rank.next ? `<p class="muted" style="margin:0 0 14px;">Next rank: ${rank.next.emoji} ${rank.next.name} — get there with points <em>or</em> words, whichever comes first!</p>
    <div class="goal-block">
      <div class="goal-label"><span>Points</span><span>${s.points||0} / ${rank.next.points}</span></div>
      <div class="goal-track"><div class="goal-fill points" style="width:${rank.pointsPct}%"></div></div>
    </div>
    <div class="goal-block">
      <div class="goal-label"><span>Words read</span><span>${words.toLocaleString()} / ${rank.next.words.toLocaleString()}</span></div>
      <div class="goal-track"><div class="goal-fill words" style="width:${rank.wordsPct}%"></div></div>
    </div>` : `<p class="muted" style="margin:0;">You've summited Mount Everest — legendary reader! 🏔️🏆</p>`}
  </div>
  <div class="card"><h3 style="margin-bottom:8px;">History</h3><div id="hist"></div></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='home'; render(); };
  const hist = c.querySelector('#hist');
  if(s.history.length===0){ hist.innerHTML = `<div class="empty">No books finished yet — go find one!</div>`; }
  else {
    s.history.forEach(h=>{
      hist.appendChild(el(`<div class="history-row"><span>${h.title}</span><span class="score-badge ${h.points>0?'good':'low'}">${h.score}%${h.points!=null ? ' · +'+h.points+'pts' : ''}</span></div>`));
    });
  }
  return c;
}

function screenTeacher(){
  if(!STATE.teacherAuthed) return screenTeacherLogin();
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2>Class roster</h2><p class="muted" style="margin:2px 0 12px;">Alias, PIN, and progress — visible to you only.</p><div id="roster"></div></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.teacherAuthed=false; STATE.teacherRows=null; STATE.screen='login'; render(); };
  const rosterDiv = c.querySelector('#roster');
  const rows = STATE.teacherRows || [];
  if(rows.length===0){ rosterDiv.innerHTML = `<div class="empty">No students yet.</div>`; }
  else {
    rows.forEach(s=>{
      rosterDiv.appendChild(el(`<div class="roster-row"><span>${s.alias} <span class="muted">PIN ${s.pin}</span></span><span class="pill">${(s.history||[]).length} books · ${s.points||0} pts</span></div>`));
    });
  }
  return c;
}

function screenTeacherLogin(){
  const c = el(`<div class="card"><button class="backlink" id="back">&larr; Back</button><h2 style="margin-bottom:6px;">Teacher dashboard</h2><p class="muted" style="margin:0 0 14px;">Enter the teacher passcode.</p><input type="password" id="pc" placeholder="Passcode" /><button class="btn" id="goBtn">View roster</button><div id="err"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='login'; render(); };
  const pcInput = c.querySelector('#pc');
  const tryAuth = ()=> teacherLogin(pcInput.value);
  pcInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAuth(); });
  c.querySelector('#goBtn').onclick = tryAuth;
  if(STATE.teacherError) c.querySelector('#err').appendChild(el(`<p class="error-text">${STATE.teacherError}</p>`));
  return c;
}

async function teacherLogin(passcode){
  STATE.loading=true; render();
  const resp = await postJSON('/api/teacher/roster', { passcode });
  STATE.loading=false;
  if(!Array.isArray(resp)){ STATE.teacherError='Wrong passcode.'; render(); return; }
  STATE.teacherAuthed = true;
  STATE.teacherRows = resp;
  STATE.teacherError = '';
  render();
}

render();
