<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piki — Read. Grow. Climb.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=optional" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --ink:#2B2118; --forest:#2F5D50; --forest-dark:#1F423A;
    --coral:#E8734A; --gold:#D9A441; --card:#FFFFFF; --line:#E7DFCE; --muted:#7A7160;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;padding:20px 18px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--forest),var(--forest-dark));display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Baloo 2';font-weight:800;font-size:16px;}
  .brand-name{font-size:20px;color:var(--forest-dark);}
  .who{font-size:13px;color:var(--muted);font-weight:700;}
  .who button{background:none;border:none;color:var(--coral);font-weight:800;cursor:pointer;padding:0;margin-left:6px;font-family:inherit;font-size:13px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(43,33,24,0.04);}
  input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:'Nunito';font-size:16px;font-weight:600;color:var(--ink);background:#fff;}
  select.class-filter{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:'Nunito';font-size:13.5px;font-weight:700;color:var(--ink);background:#fff;}
  input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--forest);outline-offset:1px;}
  input.pin-input{letter-spacing:8px;font-size:22px;text-align:center;font-weight:800;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--forest);color:#fff;border:none;border-radius:10px;padding:13px 20px;font-family:'Nunito';font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:12px;}
  .btn:hover{background:var(--forest-dark);}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .btn.secondary{background:transparent;color:var(--forest-dark);border:1.5px solid var(--forest-dark);}
  .btn.coral{background:var(--coral);}
  .btn:disabled{opacity:.7;cursor:default;}
  .btn-spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
  .btn.coral:hover{background:#cf5f38;}
  .btn[disabled]{opacity:0.55;cursor:not-allowed;}
  .btn.name-pick{background:#F6F1E4;color:var(--forest-dark);border:1.5px solid var(--line);margin-top:8px;display:flex;justify-content:space-between;align-items:center;text-align:left;}
  .btn.name-pick:hover{background:#EFEAD9;}
  .btn.name-pick .np-pts{font-size:12px;font-weight:800;color:var(--muted);}
  .muted{color:var(--muted);font-size:13.5px;}
  .error-text{color:var(--coral);font-size:13.5px;font-weight:700;margin:8px 0 0;}
  .book-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .book-row:last-child{border-bottom:none;}
  .book-row:hover{background:#faf8f2;}
  .cover{width:48px;height:68px;border-radius:5px;background:var(--line);flex:none;object-fit:cover;}
  .book-title{font-weight:800;font-size:15px;}
  .book-author{font-size:13px;color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:#EFEAD9;color:var(--forest-dark);margin-top:4px;margin-right:6px;}
  .pill.gold{background:#FBF0DA;color:#8A6412;}
  .stat-row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
  .stat{flex:1;min-width:78px;background:#F6F1E4;border-radius:12px;padding:12px;text-align:center;}
  .summary-list{margin:0;padding:0;list-style:none;}
  .summary-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .summary-list li:last-child{border-bottom:none;}
  .summary-list .sl-rank{font-weight:800;color:var(--muted);width:20px;flex:none;}
  .summary-list .sl-main{flex:1;}
  .summary-list .sl-sub{color:var(--muted);font-size:12px;}
  .stat .num{font-family:'Baloo 2';font-size:20px;color:var(--forest-dark);}
  .stat .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .quiz-q{margin-bottom:18px;}
  .quiz-q .qtext{font-weight:800;font-size:15.5px;}
  .qtext-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .speak-btn{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--forest-dark);}
  .speak-btn:hover{background:#F6F1E4;}
  .speak-btn.speaking{background:var(--coral);border-color:var(--coral);color:#fff;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .speed-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .speed-label{font-size:12.5px;font-weight:800;color:var(--muted);}
  .speed-btns{display:flex;gap:6px;}
  .speed-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-family:'Nunito';font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .speed-btn.selected{border-color:var(--forest);background:#EEF4F1;color:var(--forest-dark);}
  .opt{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px;cursor:pointer;font-family:'Nunito';font-weight:600;font-size:14.5px;color:var(--ink);}
  .opt.selected{border-color:var(--forest);background:#EEF4F1;}
  .opt.reading{border-color:var(--coral);background:#FDF2ED;box-shadow:0 0 0 2px rgba(232,115,74,0.2);}
  .qtext.reading{color:var(--coral);}
  .word-reading{background:var(--gold);border-radius:4px;box-shadow:0 0 0 2px var(--gold);}
  .review-list{margin-top:14px;text-align:left;}
  .review-q{padding:10px 12px;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--line);font-size:13.5px;}
  .review-q.correct{border-color:#BFE0D2;background:#F3FAF6;}
  .review-q.incorrect{border-color:#F4C7B4;background:#FDF2ED;}
  .review-q-head{font-weight:800;margin-bottom:4px;color:var(--ink);}
  .review-answer{color:var(--muted);}
  .review-correct{color:var(--forest-dark);font-weight:700;margin-top:2px;}
  .loading{text-align:center;padding:30px 0;color:var(--muted);font-weight:700;}
  .loading::before{content:'';display:block;width:34px;height:34px;margin:0 auto 14px;border:4px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-slide{margin-top:24px;animation:fadeSlide .5s ease;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .loading-rank{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .loading-rank .lr-emoji{font-size:36px;line-height:1;}
  .loading-rank .lr-name{font-family:'Baloo 2';font-weight:800;font-size:16px;color:var(--forest-dark);}
  .loading-rank .lr-sub{font-size:12px;color:var(--muted);font-weight:600;}
  .loading-quote{max-width:320px;margin:0 auto;font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--forest-dark);line-height:1.4;}
  .loading-quote .lq-who{margin-top:8px;font-size:12px;color:var(--muted);font-weight:700;}
  .backlink{background:none;border:none;color:var(--forest-dark);font-weight:800;font-size:14px;cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit;}
  .empty{text-align:center;padding:40px 10px;color:var(--muted);}
  .history-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .history-row:last-child{border-bottom:none;}
  .score-badge{font-weight:800;}
  .score-badge.good{color:var(--forest-dark);}
  .score-badge.low{color:var(--coral);}
  .footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.5;}
  .roster-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
  .roster-row:last-child{border-bottom:none;}
  .class-group-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .class-group-head h3{font-size:16px;color:var(--forest-dark);}
  .roster-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .roster-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
  .roster-table td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .roster-table tr:last-child td{border-bottom:none;}
  .manage-btn{background:none;border:none;color:var(--forest-dark);font-weight:800;font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;white-space:nowrap;}
  .manage-btn:hover{text-decoration:underline;}
  .del-btn{background:none;border:1.5px solid var(--line);color:var(--coral);font-weight:800;font-size:12px;cursor:pointer;padding:5px 10px;border-radius:8px;font-family:inherit;white-space:nowrap;}
  .del-btn:hover{background:#FDF2ED;border-color:var(--coral);}
  @media print{
    .topbar, .backlink, #printBtn, .footer-note, select.class-filter, .no-print{display:none !important;}
    body{background:#fff;}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  }
  .divider{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
  .setup-label{font-weight:800;font-size:14.5px;margin:0 0 4px;}
  .setup-sub{margin:0 0 12px;}
  .choice-row{display:flex;gap:8px;margin-bottom:20px;}
  .choice-btn{flex:1;text-align:center;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:'Nunito';color:var(--ink);}
  .choice-btn .cb-main{font-family:'Baloo 2';font-weight:700;font-size:16px;display:block;}
  .choice-btn .cb-sub{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-top:2px;}
  .choice-btn.selected{border-color:var(--forest);background:#EEF4F1;}
  .choice-btn.selected .cb-sub{color:var(--forest-dark);}
  .choice-col{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .conf-btn{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-family:'Nunito';display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .conf-btn.selected{border-color:var(--coral);background:#FDF2ED;}
  .conf-main{font-weight:800;font-size:14.5px;color:var(--ink);}
  .conf-sub{font-size:12px;color:var(--muted);font-weight:600;}
  .mult-tag{flex:none;font-family:'Baloo 2';font-weight:700;font-size:13px;color:var(--gold);background:#FBF0DA;padding:3px 9px;border-radius:20px;}
  .conf-btn.selected .mult-tag{background:var(--coral);color:#fff;}
  .points-banner{background:linear-gradient(135deg,var(--gold),#E8B84D);color:#4A3300;border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;}
  .points-banner .pb-num{font-family:'Baloo 2';font-weight:800;font-size:28px;}
  .points-banner .pb-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;}
  .points-pill{display:inline-block;background:#FBF0DA;color:#8A6412;font-weight:800;font-size:12px;padding:2px 9px;border-radius:20px;}
  .goal-block{margin-bottom:16px;}
  .goal-block:last-child{margin-bottom:0;}
  .goal-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--forest-dark);margin-bottom:6px;}
  .goal-track{height:10px;border-radius:20px;background:#F0EBDC;overflow:hidden;}
  .goal-fill{height:100%;border-radius:20px;transition:width .4s ease;}
  .goal-fill.points{background:var(--coral);}
  .goal-fill.words{background:var(--forest);}
  .already-done{background:#EEF4F1;border-radius:12px;padding:14px 16px;margin-top:14px;}
  .already-done-title{font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--forest-dark);}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
  .badge-chip{background:var(--forest);color:#fff;font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:20px;animation:pop .35s cubic-bezier(.3,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:9999;}
  .fw-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:9999;}
  .fw-flash{position:fixed;border-radius:50%;pointer-events:none;z-index:9998;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);}
  .husky-pop{position:fixed;pointer-events:none;z-index:9999;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
  .husky-wag{width:100%;height:100%;display:block;animation:huskyWag .5s ease-in-out infinite;}
  @keyframes huskyWag{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .bilingual-pair{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:2px;align-items:baseline;}
  .bilingual-pair .es{color:var(--muted);font-style:italic;font-weight:600;}
  .shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px;}
  .shelf-book{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(43,33,24,0.2);background:var(--line);}
  .shelf-book img{width:100%;height:100%;object-fit:cover;display:block;}
  .shelf-book .spine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 5px;color:#fff;font-family:'Baloo 2';font-weight:700;font-size:11px;line-height:1.25;}
  .shelf-badge{position:absolute;top:3px;right:3px;color:#fff;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:8px;line-height:1.3;}
  .shelf-badge.good{background:var(--forest-dark);}
  .shelf-badge.low{background:var(--coral);}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Point this at your Cloudflare Worker
const WORKER_URL = 'https://api.readpiki.com';

// Edit this list to match your actual classes/periods. `code` is stored
// forever once students sign up under it, so avoid renaming codes later -
// change the `label` instead if you just want the display text to change.
const CLASSES = [
  { code: 'period1', label: 'Period 1 - Kurth' },
  { code: 'period2', label: 'Period 2 - Sanchez' },
  { code: 'period3', label: 'Period 3 - Halvorsen' },
  { code: 'period4', label: 'Period 4 - Hamza' },
];

function getSavedClass(){
  try { return localStorage.getItem('piki_class') || null; } catch(e){ return null; }
}
function saveClass(code){
  try { localStorage.setItem('piki_class', code); } catch(e){}
}
function clearSavedClass(){
  try { localStorage.removeItem('piki_class'); } catch(e){}
}
function classLabel(code){
  const c = CLASSES.find(x=>x.code===code);
  return c ? c.label : (code || 'Unassigned');
}

const STATE = {
  classCode: getSavedClass(),
  screen: new URLSearchParams(location.search).get('teacher') ? 'teacher' : 'login', alias: null, student: null,
  roster: [], rosterLoaded: false,
  loginMode: 'pick', pendingAlias: null, loginError: '',
  signupAlias: '', signupPin: '', signupGrade: '35',
  teacherPasscode: '', teacherError: '', teacherAuthed: false, teacherRows: null,
  teacherManagingAlias: null, teacherManagingClass: null, teacherClassFilter: 'all', showFullBookList: false,
  searchResults: [], searchQuery: '', currentBook: null,
  quiz: null, quizAnswers: {}, loading: false, loadingMsg: '',
  quizSetup: { count: 7, confidence: 'medium', challenge: 'onlevel', bilingual: 0 },
  speechRate: 0.95,
  resultAnimated: false,
  quizGateError: '',
  manualTitle: '', manualAuthor: '', manualError: '',
};

// ---------- Points system ----------
const QUIZ_LENGTHS = [5, 7, 10];
const LENGTH_BONUS = { 5: 0, 7: 5, 10: 10 };
const GRADE_BANDS = {
  k2:  { label: 'K-2',   sub: 'Ages 5-8' },
  '35': { label: '3-5',  sub: 'Ages 8-11' },
  '68': { label: '6-8',  sub: 'Ages 11-14' },
  '912': { label: '9-12', sub: 'Ages 14-18' },
};
const CHALLENGE = {
  easier:  { label: 'Easier',    sub: 'Simpler wording' },
  onlevel: { label: 'Just right', sub: 'Matches my grade' },
  harder:  { label: 'Harder',    sub: 'Push me a bit' },
};
const BILINGUAL_CHOICES = {
  0: { label: 'English only', sub: 'Default' },
  1: { label: 'English + Español', sub: 'Shown together' },
};
const CONFIDENCE = {
  low:    { label: 'Not sure',        sub: "Haven't read it closely, or it's been a while", mult: 1   },
  medium: { label: 'Pretty sure',     sub: 'I remember most of the story',                  mult: 1.5 },
  high:   { label: 'Know it well',    sub: "I could retell the whole book",                 mult: 2   },
};
const POINTS_PER_CORRECT = 10;
const PENALTY_PER_WRONG = 3;
const POINT_MILESTONES = [50, 100, 250, 500, 1000, 2000];
const STREAK_MILESTONES = [3, 5, 10, 20];

const MASTERY_PCT = 0.8;
function meetsMastery(correct, total){
  return correct >= Math.ceil(total * MASTERY_PCT);
}

function computeQuizPoints(correct, total, confidenceKey, count){
  if(!meetsMastery(correct, total)) return 0;
  const mult = (CONFIDENCE[confidenceKey] || CONFIDENCE.medium).mult;
  const wrong = total - correct;
  const raw = correct * POINTS_PER_CORRECT * mult - wrong * PENALTY_PER_WRONG * mult;
  return Math.max(0, Math.round(raw)) + (LENGTH_BONUS[count] || 0);
}

function lengthTag(pages){
  if(!pages) return null;
  if(pages < 150) return 'Quick read';
  if(pages <= 320) return 'Standard length';
  return 'Chunky read';
}

const TESTING_START_MIN = 7*60 + 40;  // 7:40 AM
const TESTING_END_MIN = 14*60 + 40;   // 2:40 PM
function isTestingHours(){
  return true; // time window disabled while developing after hours — restore the check below before going live
  // if(new URLSearchParams(location.search).get('preview') === '1') return true; // teacher testing bypass
  // const now = new Date();
  // const minutes = now.getHours()*60 + now.getMinutes();
  // return minutes >= TESTING_START_MIN && minutes <= TESTING_END_MIN;
}

function findPriorAttempt(history, book){
  return (history||[]).find(h =>
    (book.olid && h.olid && h.olid === book.olid) ||
    (h.title||'').trim().toLowerCase() === (book.title||'').trim().toLowerCase()
  );
}

function currentStreak(history){
  let streak = 0;
  for(const h of history){ if(h.points>0) streak++; else break; }
  return streak;
}

// Shared rank ladder, framed as a climb up Mount Everest: reachable via points
// (rewards quiz performance/volume) OR words read (rewards tackling longer
// books) - whichever a student hits first. 1,000,000 words is the summit -
// many smaller checkpoints lead up to it so progress always feels close.
const RANKS = [
  { name: 'Page Turner',          emoji: '📖', points: 0,    words: 0 },
  { name: 'Bookworm',             emoji: '🐛', points: 20,   words: 3000 },
  { name: 'Story Chaser',         emoji: '🏃', points: 50,   words: 8000 },
  { name: 'Trailblazer',          emoji: '🥾', points: 90,   words: 15000 },
  { name: 'Base Camp',            emoji: '⛺', points: 150,  words: 25000 },
  { name: 'Climber',              emoji: '🧗', points: 240,  words: 40000 },
  { name: 'Chapter Champion',     emoji: '⭐', points: 350,  words: 60000 },
  { name: 'Camp One',             emoji: '🏔️', points: 550,  words: 90000 },
  { name: 'Camp Two',             emoji: '🏔️', points: 800,  words: 130000 },
  { name: 'High Camp',            emoji: '❄️', points: 1100, words: 180000 },
  { name: 'Legend of the Library',emoji: '🏛️', points: 1500, words: 250000 },
  { name: 'Summit Push',          emoji: '🚵', points: 2100, words: 350000 },
  { name: 'Piki Master',          emoji: '👑', points: 3000, words: 500000 },
  { name: 'Everest Approach',     emoji: '🌄', points: 4200, words: 700000 },
  { name: 'Summit of Everest',    emoji: '🏆', points: 6000, words: 1000000 },
];

function getRankInfo(points, words){
  points = points||0; words = words||0;
  let rankIdx = 0;
  for(let i=0;i<RANKS.length;i++){
    if(points >= RANKS[i].points || words >= RANKS[i].words) rankIdx = i;
  }
  const current = RANKS[rankIdx];
  const next = RANKS[rankIdx+1] || null;
  let pointsPct = 100, wordsPct = 100;
  if(next){
    pointsPct = Math.min(100, Math.round(((points - current.points) / (next.points - current.points)) * 100));
    wordsPct = Math.min(100, Math.round(((words - current.words) / (next.words - current.words)) * 100));
  }
  return { rankIdx, current, next, pointsPct: Math.max(0,pointsPct), wordsPct: Math.max(0,wordsPct) };
}

async function doSignup(alias, pin){
  alias = (alias||'').trim();
  if(!alias){ STATE.loginError='Pick an alias first.'; render(); return; }
  if(!/^\d{4}$/.test(pin||'')){ STATE.loginError='PIN must be exactly 4 digits.'; render(); return; }
  STATE.loading=true; STATE.loadingMsg='Setting up your shelf...'; render();
  const resp = await postJSON('/api/signup', { alias, pin, grade: STATE.signupGrade, classCode: STATE.classCode });
  STATE.loading=false;
  if(resp.error==='alias_taken'){ STATE.loginError='That alias is taken — try another.'; render(); return; }
  if(resp.error){ STATE.loginError='Something went wrong. Try again.'; render(); return; }
  STATE.alias = resp.alias;
  STATE.student = resp;
  STATE.rosterLoaded = false;
  STATE.screen = resp.realName ? 'home' : 'nameCapture';
  render();
}

async function doLogin(alias, pin){
  if(!/^\d{4}$/.test(pin||'')){ STATE.loginError='Enter your 4-digit PIN.'; render(); return; }
  STATE.loading=true; STATE.loadingMsg='Loading your bookshelf...'; render();
  const resp = await postJSON('/api/login', { alias, pin, classCode: STATE.classCode });
  STATE.loading=false;
  if(resp.error==='wrong_pin'){ STATE.loginError='Wrong PIN — try again.'; render(); return; }
  if(resp.error){ STATE.loginError='Could not find that alias.'; render(); return; }
  STATE.alias = resp.alias;
  STATE.student = resp;
  STATE.screen = resp.realName ? 'home' : 'nameCapture';
  render();
}

async function searchOpenLibrary(q){
  try{
    const resp = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&fields=title,author_name,key,number_of_pages_median,first_publish_year,cover_i&limit=10`);
    const data = await resp.json();
    return (data.docs||[]).filter(d=>d.title).slice(0,8);
  }catch(e){ return []; }
}

// Google's search backend is far more typo-tolerant than Open Library's
// strict text search, which matters a lot for young students who
// frequently misspell titles/authors. We query both in parallel and merge
// them (Google first) rather than only falling back to Google when Open
// Library comes back empty - Open Library can return a handful of wrong
// matches for a misspelled query instead of zero, which used to skip the
// Google fallback entirely.
async function searchGoogleBooks(q){
  try{
    const resp = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&printType=books`);
    const data = await resp.json();
    return (data.items||[]).filter(it=>it.volumeInfo && it.volumeInfo.title).map(it=>{
      const vi = it.volumeInfo;
      const year = vi.publishedDate ? parseInt(vi.publishedDate.slice(0,4), 10) : null;
      const cover = vi.imageLinks && (vi.imageLinks.thumbnail || vi.imageLinks.smallThumbnail);
      return {
        title: vi.title + (vi.subtitle ? ': ' + vi.subtitle : ''),
        author_name: vi.authors || ['Unknown'],
        key: '/works/gbooks:' + it.id,
        number_of_pages_median: vi.pageCount || null,
        first_publish_year: isNaN(year) ? null : year,
        coverUrl: cover ? cover.replace(/^http:/, 'https:') : null,
        description: vi.description || '',
        source: 'gbooks',
      };
    });
  }catch(e){ return []; }
}

function normalizeSearchKey(title, authors){
  const t = (title||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  const a = ((authors&&authors[0])||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  return t+'|'+a;
}
function mergeSearchResults(primary, secondary){
  const seen = new Set();
  const out = [];
  primary.concat(secondary).forEach(b=>{
    const key = normalizeSearchKey(b.title, b.author_name);
    if(seen.has(key)) return;
    seen.add(key);
    out.push(b);
  });
  return out.slice(0,10);
}

async function runSearch(){
  const q = document.getElementById('q').value.trim().replace(/\s+/g,' ');
  if(!q) return;
  STATE.searchQuery = q;
  STATE.loading = true; STATE.loadingMsg='Searching...'; render();
  try{
    const [gbResults, olResults] = await Promise.all([searchGoogleBooks(q), searchOpenLibrary(q)]);
    STATE.searchResults = mergeSearchResults(gbResults, olResults);
  }catch(e){ STATE.searchResults = []; }
  STATE.loading = false;
  render();
}

async function openBook(b){
  STATE.loading = true; STATE.loadingMsg = 'Reading up on this book...'; render();
  const olid = b.key.replace('/works/','');
  let description = b.description || '';
  if(b.source !== 'gbooks'){
    try{
      const workResp = await fetch(`https://openlibrary.org${b.key}.json`);
      const work = await workResp.json();
      description = typeof work.description === 'string' ? work.description : (work.description && work.description.value) || '';
    }catch(e){}
  }

  const pages = b.number_of_pages_median || null;

  const meta = await api('/api/book-meta', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ olid, title: b.title, author: (b.author_name||['Unknown']).join(', '), year: b.first_publish_year, description })
  });

  STATE.currentBook = {
    title: b.title, author: (b.author_name||['Unknown']).join(', '),
    pages, wordEstimate: meta.estimatedWordCount || null, summary: meta.summary, genre: meta.genre,
    olid, cover_i: b.cover_i || null, coverUrl: b.coverUrl || null
  };
  STATE.loading = false;
  STATE.screen = 'book';
  render();
}

async function openManualBook(title, author){
  STATE.loading = true; STATE.loadingMsg = 'Reading up on this book...'; render();
  const slug = s=>(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
  const olid = 'manual:' + slug(title) + (author ? '-' + slug(author) : '');

  const meta = await api('/api/book-meta', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ olid, title, author: author || 'Unknown', year: null, description: '' })
  });

  STATE.currentBook = {
    title, author: author || 'Unknown',
    pages: null, wordEstimate: meta.estimatedWordCount || null, summary: meta.summary, genre: meta.genre,
    olid, cover_i: null, coverUrl: null
  };
  STATE.loading = false;
  STATE.screen = 'book';
  render();
}

let speechToken = 0;
function stopQuizSpeech(){
  if(!('speechSynthesis' in window)) return;
  speechToken++;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  document.querySelectorAll('.opt.reading, .qtext.reading').forEach(o=>o.classList.remove('reading'));
  document.querySelectorAll('.word-reading').forEach(w=>w.classList.remove('word-reading'));
}

// Splits `container`'s visible primary text (skipping a bilingual Spanish
// subtitle if present) into word spans matching `spokenText` exactly, so
// SpeechSynthesisUtterance's per-word `boundary` events can drive a
// karaoke-style highlight as each word is read. Returns null if the text
// can't be matched (falls back to whole-element highlighting only).
function prepareWordHighlight(container, spokenText){
  const target = container.querySelector('.bilingual-pair > span:not(.es)') || container;
  const full = target.textContent;
  const idx = full.lastIndexOf(spokenText);
  if(idx === -1) return null;
  const prefix = full.slice(0, idx);
  const original = target.innerHTML;
  target.textContent = '';
  if(prefix) target.appendChild(document.createTextNode(prefix));
  const words = [];
  const re = /\S+/g;
  let m, lastEnd = 0;
  while((m = re.exec(spokenText))){
    if(m.index > lastEnd) target.appendChild(document.createTextNode(spokenText.slice(lastEnd, m.index)));
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = m[0];
    target.appendChild(span);
    words.push({ start: m.index, end: m.index + m[0].length, el: span });
    lastEnd = m.index + m[0].length;
  }
  if(lastEnd < spokenText.length) target.appendChild(document.createTextNode(spokenText.slice(lastEnd)));
  return { words, restore(){ target.innerHTML = original; } };
}

// Speaks a short lead-in ("Question 1.", "A.") for context, then the exact
// visible text of the question/option as its own utterance so per-word
// `boundary` events line up with the word spans built above, highlighting
// each word as it's read aloud.
function speakQuizItem(btn, qDiv, q, qi){
  const wasSpeaking = btn.classList.contains('speaking');
  stopQuizSpeech();
  if(wasSpeaking) return;

  const myToken = speechToken;
  const letters = ['A','B','C','D','E','F'];
  const optEls = qDiv.querySelectorAll('.opt');
  const qtextEl = qDiv.querySelector('.qtext');
  const items = [{ lead: `Question ${qi+1}.`, text: q.q, el: qtextEl }];
  q.options.forEach((opt,oi)=>{ items.push({ lead: `${letters[oi]}.`, text: opt, el: optEls[oi] }); });

  btn.classList.add('speaking');
  let i = 0;
  function speak(text, onDone){
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = STATE.speechRate;
    utter.onend = utter.onerror = onDone;
    return utter;
  }
  function speakNext(){
    if(myToken !== speechToken) return; // superseded by a stop or new playback
    if(i >= items.length){ btn.classList.remove('speaking'); return; }
    const item = items[i++];
    window.speechSynthesis.speak(speak(item.lead, ()=>{
      if(myToken !== speechToken) return;
      item.el.classList.add('reading');
      const highlight = prepareWordHighlight(item.el, item.text);
      const bodyUtter = speak(item.text, ()=>{
        item.el.classList.remove('reading');
        if(highlight && myToken===speechToken) highlight.restore();
        speakNext();
      });
      if(highlight){
        bodyUtter.onboundary = (e)=>{
          if(myToken !== speechToken || (e.name && e.name !== 'word')) return;
          const current = highlight.words.find(w=> e.charIndex>=w.start && e.charIndex<w.end);
          highlight.words.forEach(w=>w.el.classList.toggle('word-reading', w===current));
        };
      }
      window.speechSynthesis.speak(bodyUtter);
    }));
  }
  speakNext();
}

function computeBadges(s, r, prevPoints, prevWords, prevRankIdx){
  const badges = [];
  if(s.history.length === 1) badges.push({emoji:'🌱', label:'First Book!'});
  if(r.pct === 100) badges.push({emoji:'💯', label:'Perfect Score'});
  const streak = currentStreak(s.history);
  if(STREAK_MILESTONES.includes(streak)) badges.push({emoji:'🔥', label: streak+'-Book Streak'});
  POINT_MILESTONES.forEach(m=>{ if(prevPoints < m && s.points >= m) badges.push({emoji:'🏆', label: m+' Points!'}); });
  const newRank = getRankInfo(s.points, s.wordsRead);
  if(newRank.rankIdx > prevRankIdx) badges.push({emoji:newRank.current.emoji, label:'Rank Up: '+newRank.current.name+'!'});
  return badges;
}

async function submitQuiz(){
  const qs = STATE.quiz.questions;
  let correct = 0;
  const review = qs.map((q,qi)=>{
    const chosenIndex = STATE.quizAnswers[qi];
    const isCorrect = chosenIndex === q.correctIndex;
    if(isCorrect) correct++;
    return { q: q.q, options: q.options, correctIndex: q.correctIndex, chosenIndex, isCorrect };
  });
  const pct = Math.round((correct/qs.length)*100);

  const b = STATE.currentBook;
  const s = STATE.student;
  const confidence = STATE.quizSetup.confidence;
  const count = STATE.quizSetup.count;
  const earnedPoints = computeQuizPoints(correct, qs.length, confidence, count);
  const prevPoints = s.points||0;
  const prevWords = s.wordsRead||0;
  const prevRankIdx = getRankInfo(prevPoints, prevWords).rankIdx;

  s.history.unshift({ title:b.title, olid:b.olid, cover_i:b.cover_i||null, coverUrl:b.coverUrl||null, score:pct, date:new Date().toISOString().slice(0,10), points:earnedPoints, count, confidence, words:b.wordEstimate||0 });
  s.points = prevPoints + earnedPoints;
  s.wordsRead = prevWords + (b.wordEstimate||0);
  await saveStudent(s.alias, s);

  const result = { correct, total: qs.length, pct, earnedPoints, totalPoints: s.points, confidence, review };
  result.badges = computeBadges(s, result, prevPoints, prevWords, prevRankIdx);

  STATE.quizResult = result;
  STATE.resultAnimated = false;
  STATE.showReview = false;
  STATE.screen = 'result';
  render();
}

function animateNumber(node, to, duration){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    node.textContent = '+' + Math.round(eased*to);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Fires a few staggered firework bursts (a bright flash plus radiating
// particles) at random spots across the top of the screen, for the
// pass-the-quiz celebration.
function fireFireworks(){
  const colors = ['#E8734A','#D9A441','#2F5D50','#7A9E8C','#3F8FD9'];
  const bursts = [
    { x: 20+Math.random()*15, y: 26+Math.random()*10, delay: 0 },

      requestAnimationFrame(()=>{

      });

      const color = colors[Math.floor(Math.random()*colors.length)];

function screenResult(){
  const r = STATE.quizResult;
  const good = meetsMastery(r.correct, r.total);
  const mult = (CONFIDENCE[r.confidence] || CONFIDENCE.medium).mult;
  const headline = (good ? CELEBRATE_GOOD : CELEBRATE_OK)[Math.floor(Math.random()*(good?CELEBRATE_GOOD:CELEBRATE_OK).length)];
  const masteryNote = !good ? `<p class="muted" style="margin:0 0 14px;">Quizzes need 80% or higher to earn points — this one still counts as finished, just no points this time.</p>` : '';
  const reviewSection = r.review ? `<button type="button" class="btn secondary" id="reviewToggle">${STATE.showReview ? 'Hide' : 'Review'} your answers</button>${STATE.showReview ? `<div class="review-list">${renderReviewList(r.review)}</div>` : ''}` : '';
  const c = el(`<div class="card" style="text-align:center;"><h2>${headline}</h2><p class="muted" style="margin:6px 0 16px;">${r.correct} of ${r.total} correct</p>${masteryNote}${r.badges.length ? `<div class="badge-row">${r.badges.map(b=>`<span class="badge-chip">${b.emoji} ${b.label}</span>`).join('')}</div>` : ''}<div class="points-banner"><div class="pb-num">+0</div><div class="pb-lbl">Points earned · ${mult}x confidence</div></div><div class="stat-row"><div class="stat"><div class="num">${r.pct}%</div><div class="lbl">Score</div></div><div class="stat"><div class="num">${r.totalPoints}</div><div class="lbl">Total Points</div></div></div>${reviewSection}<button class="btn" id="nextBtn">Find another book</button><button class="btn secondary" id="dashBtn">See my progress</button></div>`);
  c.querySelector('#nextBtn').onclick = ()=>{ STATE.screen='search'; STATE.searchResults=[]; STATE.searchQuery=''; render(); };
  c.querySelector('#dashBtn').onclick = ()=>{ STATE.screen='dashboard'; render(); };
  const reviewBtn = c.querySelector('#reviewToggle');
  if(reviewBtn) reviewBtn.onclick = ()=>{ STATE.showReview = !STATE.showReview; render(); };
  if(!STATE.resultAnimated){
    STATE.resultAnimated = true;
    setTimeout(()=>{
      const numEl = document.querySelector('.pb-num');
      if(numEl) animateNumber(numEl, r.earnedPoints, 800);
      fireConfetti();
      if(good){ fireFireworks(); fireHuskies(); }
    }, 30);
  }
  return c;
}

const SHELF_COLORS = ['#2F5D50','#8A3B2B','#B98A2E','#2C3E66','#5B4636'];
function shelfColor(title){
  let h = 0;
  for(let i=0;i<title.length;i++) h = (h*31 + title.charCodeAt(i)) >>> 0;
  return SHELF_COLORS[h % SHELF_COLORS.length];
}

function shelfSpine(title){
  return el(`<div class="spine" style="background:${shelfColor(title)}">${title}</div>`);
}

function screenDashboard(){
  const s = STATE.student;
  const words = s.wordsRead||0;
  const rank = getRankInfo(s.points, words);
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><h2>${s.alias}'s bookshelf</h2><p class="muted" style="margin:4px 0 0;"><span class="points-pill">${s.points||0} pts</span></p><div class="stat-row"><div class="stat"><div class="num">${s.history.length}</div><div class="lbl">Books Finished</div></div><div class="stat"><div class="num">${words.toLocaleString()}</div><div class="lbl">Words Read</div></div><div class="stat"><div class="num">${currentStreak(s.history)}</div><div class="lbl">Current Streak</div></div></div></div>
  <div class="card">
    <h3 style="margin-bottom:2px;">${rank.current.emoji} ${rank.current.name}</h3>
    ${rank.next ? `<p class="muted" style="margin:0 0 14px;">Next rank: ${rank.next.emoji} ${rank.next.name} — get there with points <em>or</em> words, whichever comes first!</p>
    <div class="goal-block">
      <div class="goal-label"><span>Points</span><span>${s.points||0} / ${rank.next.points}</span></div>
      <div class="goal-track"><div class="goal-fill points" style="width:${rank.pointsPct}%"></div></div>
    </div>
    <div class="goal-block">
      <div class="goal-label"><span>Words read</span><span>${words.toLocaleString()} / ${rank.next.words.toLocaleString()}</span></div>
      <div class="goal-track"><div class="goal-fill words" style="width:${rank.wordsPct}%"></div></div>
    </div>` : `<p class="muted" style="margin:0;">You've summited Mount Everest — legendary reader! 🏔️🏆</p>`}
  </div>
  <div class="card"><h3 style="margin-bottom:2px;">My Shelf</h3><p class="muted" style="margin:0 0 14px;">Every book you've finished, in order.</p><div class="shelf-grid" id="shelf"></div></div>
  <div class="card"><h3 style="margin-bottom:8px;">History</h3><div id="hist"></div></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='home'; render(); };
  const shelf = c.querySelector('#shelf');
  if(s.history.length===0){ shelf.innerHTML = `<div class="empty">No books finished yet — go find one!</div>`; }
  else {
    s.history.forEach(h=>{
      const badgeCls = h.points>0 ? 'good' : 'low';
      const tipTitle = h.title.replace(/"/g,'&quot;');
      const tile = el(`<div class="shelf-book" title="${tipTitle} — ${h.score}%${h.points!=null ? ' · +'+h.points+' pts' : ''} · ${h.date}"></div>`);
      const coverSrc = h.coverUrl || (h.cover_i ? `https://covers.openlibrary.org/b/id/${h.cover_i}-M.jpg` : null);
      if(coverSrc){
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = '';
        img.onerror = ()=> img.replaceWith(shelfSpine(h.title));
        img.onload = ()=>{ if(img.naturalWidth <= 1) img.replaceWith(shelfSpine(h.title)); };
        img.src = coverSrc;
        tile.appendChild(img);
      } else {
        tile.appendChild(shelfSpine(h.title));
      }
      tile.appendChild(el(`<span class="shelf-badge ${badgeCls}">${h.score}%</span>`));
      shelf.appendChild(tile);
    });
  }
  const hist = c.querySelector('#hist');
  if(s.history.length===0){ hist.innerHTML = `<div class="empty">No books finished yet — go find one!</div>`; }
  else {
    s.history.forEach(h=>{
      hist.appendChild(el(`<div class="history-row"><span>${h.title}</span><span class="score-badge ${h.points>0?'good':'low'}">${h.score}%${h.points!=null ? ' · +'+h.points+'pts' : ''}</span></div>`));
    });
  }
  return c;
}

function groupTeacherRows(rows){
  const byClass = {};
  rows.forEach(s=>{
    const code = s.classCode || 'default';
    (byClass[code] = byClass[code] || []).push(s);
  });
  const knownOrder = CLASSES.map(cl=>cl.code);
  const order = knownOrder.concat(Object.keys(byClass).filter(code=>!knownOrder.includes(code)));
  return order
    .filter(code=>byClass[code] && byClass[code].length)
    .map(code=>({ code, label: classLabel(code), students: byClass[code] }));
}

function filterRowsByClass(rows, classFilter){
  if(!classFilter || classFilter === 'all') return rows;
  return rows.filter(s => (s.classCode||'default') === classFilter);
}

// Builds a <select> for filtering the roster/summary/print views down to one
// class - options come from whatever classes actually have students, not
// the static CLASSES list, so it stays correct even with legacy/unknown codes.
function classFilterSelect(rows){
  const groups = groupTeacherRows(rows);
  const options = [`<option value="all"${STATE.teacherClassFilter==='all'?' selected':''}>All classes</option>`]
    .concat(groups.map(g=>`<option value="${g.code}"${STATE.teacherClassFilter===g.code?' selected':''}>${g.label}</option>`));
  const select = el(`<select class="class-filter">${options.join('')}</select>`);
  select.onchange = ()=>{ STATE.teacherClassFilter = select.value; render(); };
  return select;
}

function studentStats(s){
  const hist = s.history || [];
  const avgScore = hist.length ? Math.round(hist.reduce((sum,h)=>sum+(h.score||0),0) / hist.length) : null;
  const rank = getRankInfo(s.points||0, s.wordsRead||0);
  return { books: hist.length, avgScore, rank };
}

function screenTeacher(){
  if(!STATE.teacherAuthed) return screenTeacherLogin();
  const rows = STATE.teacherRows || [];
  const groups = groupTeacherRows(filterRowsByClass(rows, STATE.teacherClassFilter));
  const c = el(`<div><button class="backlink" id="back">&larr; Back</button><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><div><h2 style="margin-bottom:2px;">Class roster</h2><p class="muted" style="margin:0;">Alias, PIN, and progress — visible to you only.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><span id="filterSlot"></span><button class="btn secondary" id="summaryBtn" style="width:auto;margin:0;padding:10px 18px;">📊 Summary report</button><button class="btn secondary" id="printBtn" style="width:auto;margin:0;padding:10px 18px;">🖨️ Print report</button></div></div></div><div id="groups"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.teacherAuthed=false; STATE.teacherRows=null; STATE.teacherPasscode=''; STATE.screen='login'; render(); };
  c.querySelector('#printBtn').onclick = ()=> window.print();
  c.querySelector('#summaryBtn').onclick = ()=>{ STATE.screen='teacherSummary'; render(); };
  c.querySelector('#filterSlot').replaceWith(classFilterSelect(rows));
  const groupsDiv = c.querySelector('#groups');
  if(groups.length===0){
    groupsDiv.appendChild(el(`<div class="card"><div class="empty">No students yet.</div></div>`));
  } else {
    groups.forEach(g=>{
      const scores = g.students.map(s=>studentStats(s).avgScore).filter(v=>v!=null);
      const classAvg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
      // Built as one HTML string (not appended row-by-row) because a bare
      // <tr>/<td> set via innerHTML on a div outside a real <table> parsing
      // context gets silently dropped by the browser, leaving just text.
      const rowsHtml = g.students.map(s=>{
        const stats = studentStats(s);
        return `<tr><td>${s.alias}</td><td>${s.realName || '—'}</td><td>${s.pin}</td><td>${stats.books}</td><td>${stats.avgScore!=null ? stats.avgScore+'%' : '—'}</td><td>${s.points||0}</td><td>${stats.rank.current.emoji} ${stats.rank.current.name}</td><td><button type="button" class="manage-btn">Manage ›</button></td></tr>`;
      }).join('');
      const groupCard = el(`<div class="card class-group"><div class="class-group-head"><h3>${g.label}</h3><span class="muted">${g.students.length} student${g.students.length===1?'':'s'}${classAvg!=null ? ' · class avg '+classAvg+'%' : ''}</span></div><div style="overflow-x:auto;"><table class="roster-table"><thead><tr><th>Alias</th><th>Name</th><th>PIN</th><th>Books</th><th>Avg score</th><th>Points</th><th>Rank</th><th></th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`);
      groupCard.querySelectorAll('.manage-btn').forEach((btn,i)=>{
        btn.onclick = ()=>{
          const s = g.students[i];
          STATE.teacherManagingAlias = s.alias;
          STATE.teacherManagingClass = s.classCode || 'default';
          STATE.screen = 'teacherStudent';
          render();
        };
      });
      groupsDiv.appendChild(groupCard);
    });
  }
  return c;
}

function screenTeacherSummary(){
  const allRows = STATE.teacherRows || [];
  const rows = filterRowsByClass(allRows, STATE.teacherClassFilter);
  const attempts = rows.flatMap(s => (s.history||[]).map(h => ({ ...h, alias: s.alias, classCode: s.classCode })));
  const totalStudents = rows.length;
  const totalBooks = attempts.length;
  const avgScore = attempts.length ? Math.round(attempts.reduce((sum,a)=>sum+(a.score||0),0)/attempts.length) : null;
  const totalPoints = rows.reduce((sum,s)=>sum+(s.points||0),0);

  const groups = groupTeacherRows(rows);
  const classRowsHtml = groups.map(g=>{
    const classAttempts = attempts.filter(a=>(a.classCode||'default')===g.code);
    const classAvg = classAttempts.length ? Math.round(classAttempts.reduce((sum,a)=>sum+(a.score||0),0)/classAttempts.length) : null;
    return `<tr><td>${g.label}</td><td>${g.students.length}</td><td>${classAttempts.length}</td><td>${classAvg!=null?classAvg+'%':'—'}</td></tr>`;
  }).join('');
  const classSection = groups.length===0
    ? `<div class="empty">No students yet.</div>`
    : `<div style="overflow-x:auto;"><table class="roster-table"><thead><tr><th>Class</th><th>Students</th><th>Books</th><th>Avg score</th></tr></thead><tbody>${classRowsHtml}</tbody></table></div>`;

  const topReaders = [...rows].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,5);
  const topReadersHtml = topReaders.map((s,i)=>{
    const stats = studentStats(s);
    return `<li><span class="sl-rank">${i+1}.</span><span class="sl-main">${s.alias}<div class="sl-sub">${classLabel(s.classCode)} · ${stats.books} book${stats.books===1?'':'s'}</div></span><span>${s.points||0} pts</span></li>`;
  }).join('');
  const topReadersSection = topReaders.length===0 ? `<div class="empty">No quizzes yet.</div>` : `<ul class="summary-list">${topReadersHtml}</ul>`;

  const bookCounts = {};
  attempts.forEach(a=>{ bookCounts[a.title] = (bookCounts[a.title]||0)+1; });
  const topBooks = Object.entries(bookCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topBooksHtml = topBooks.map(([title,count])=>`<li><span class="sl-main">${title}</span><span>${count} read${count===1?'':'s'}</span></li>`).join('');
  const topBooksSection = topBooks.length===0 ? `<div class="empty">No quizzes yet.</div>` : `<ul class="summary-list">${topBooksHtml}</ul>`;

  const recent = [...attempts].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,12);
  const recentRowsHtml = recent.map(a=>`<tr><td>${a.date}</td><td>${a.alias}</td><td>${classLabel(a.classCode)}</td><td>${a.title}</td><td>${a.score}%</td></tr>`).join('');
  const recentSection = recent.length===0 ? `<div class="empty">No quizzes yet.</div>` : `<div style="overflow-x:auto;"><table class="roster-table"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Book</th><th>Score</th></tr></thead><tbody>${recentRowsHtml}</tbody></table></div>`;

  // Full, uncapped log of every book taken (vs. "Recent activity" above,
  // which is capped to a quick glance) - collapsed by default since it can
  // get long, but expand it before printing to include the whole list.
  const allBooks = [...attempts].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const allBooksRowsHtml = allBooks.map(a=>`<tr><td>${a.date}</td><td>${a.alias}</td><td>${classLabel(a.classCode)}</td><td>${a.title}</td><td>${a.score}%</td><td>${a.points!=null ? '+'+a.points : '—'}</td></tr>`).join('');
  const allBooksTable = allBooks.length===0 ? `<div class="empty">No quizzes yet.</div>` : `<div style="overflow-x:auto;"><table class="roster-table"><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Book</th><th>Score</th><th>Points</th></tr></thead><tbody>${allBooksRowsHtml}</tbody></table></div>`;
  const bookListToggleLabel = STATE.showFullBookList ? 'Hide full list' : `Show full list (${allBooks.length})`;

  const scopeLabel = STATE.teacherClassFilter==='all' ? 'across all classes' : 'for ' + classLabel(STATE.teacherClassFilter);
  const c = el(`<div><button class="backlink" id="back">&larr; Back to roster</button><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><h2 style="margin-bottom:2px;">Summary report</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><span id="filterSlot"></span><button class="btn secondary" id="printBtn" style="width:auto;margin:0;padding:10px 18px;">🖨️ Print</button></div></div><p class="muted" style="margin:0;">A snapshot ${scopeLabel}, as of right now.</p><div class="stat-row"><div class="stat"><div class="num">${totalStudents}</div><div class="lbl">Students</div></div><div class="stat"><div class="num">${totalBooks}</div><div class="lbl">Books finished</div></div><div class="stat"><div class="num">${avgScore!=null?avgScore+'%':'—'}</div><div class="lbl">Avg score</div></div><div class="stat"><div class="num">${totalPoints}</div><div class="lbl">Total points</div></div></div></div><div class="card"><h3 style="margin-bottom:10px;">By class</h3>${classSection}</div><div class="card"><h3 style="margin-bottom:10px;">Top readers</h3>${topReadersSection}</div><div class="card"><h3 style="margin-bottom:10px;">Most-read books</h3>${topBooksSection}</div><div class="card"><h3 style="margin-bottom:10px;">Recent activity</h3>${recentSection}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;"><h3 style="margin-bottom:0;">All books taken</h3><button type="button" class="btn secondary no-print" id="bookListToggle" style="width:auto;margin:0;padding:8px 14px;">${bookListToggleLabel}</button></div>${STATE.showFullBookList ? allBooksTable : ''}</div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='teacher'; render(); };
  c.querySelector('#printBtn').onclick = ()=> window.print();
  c.querySelector('#filterSlot').replaceWith(classFilterSelect(allRows));
  c.querySelector('#bookListToggle').onclick = ()=>{ STATE.showFullBookList = !STATE.showFullBookList; render(); };
  return c;
}

function screenTeacherStudent(){
  const s = (STATE.teacherRows || []).find(r=>r.alias===STATE.teacherManagingAlias && (r.classCode||'default')===STATE.teacherManagingClass);
  if(!s){ STATE.screen='teacher'; return screenTeacher(); }
  const hist = s.history || [];
  const rowsHtml = hist.map(h=>`<tr><td>${h.title}</td><td>${h.score}%</td><td>${h.points!=null ? '+'+h.points : '—'}</td><td>${h.date}</td><td class="no-print"><button type="button" class="del-btn">🗑️ Delete</button></td></tr>`).join('');
  const c = el(`<div><button class="backlink" id="back">&larr; Back to roster</button><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><div><h2 style="margin-bottom:2px;">${s.alias}${s.realName ? ` <span class="muted" style="font-weight:600;font-size:14px;">(${s.realName})</span>` : ''}</h2><p class="muted" style="margin:0;">${classLabel(s.classCode)} · PIN ${s.pin} · ${s.points||0} pts</p></div><button class="btn secondary no-print" id="printBtn" style="width:auto;margin:0;padding:10px 18px;">🖨️ Print</button></div>${hist.length===0 ? `<div class="empty">No quizzes taken yet.</div>` : `<div style="overflow-x:auto;margin-top:14px;"><table class="roster-table"><thead><tr><th>Book</th><th>Score</th><th>Points</th><th>Date</th><th class="no-print"></th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`}</div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='teacher'; render(); };
  c.querySelector('#printBtn').onclick = ()=> window.print();
  c.querySelectorAll('.del-btn').forEach((btn,i)=>{
    btn.onclick = ()=>{
      const h = hist[i];
      if(!confirm(`Delete "${h.title}" (${h.score}%) from ${s.alias}'s history? This can't be undone.`)) return;
      deleteAttempt(s.alias, s.classCode || 'default', i);
    };
  });
  return c;
}

async function deleteAttempt(alias, classCode, index){
  const resp = await postJSON('/api/teacher/delete-attempt', { passcode: STATE.teacherPasscode, alias, classCode, index });
  if(resp.error){ alert('Could not delete that attempt: ' + resp.error); return; }
  const idx = (STATE.teacherRows || []).findIndex(r=>r.alias===alias && (r.classCode||'default')===classCode);
  if(idx !== -1) STATE.teacherRows[idx] = resp;
  render();
}

function screenTeacherLogin(){
  const checking = STATE.loading;
  const goBtnInner = checking ? `<span class="btn-spinner"></span> Checking...` : 'View roster';
  const c = el(`<div class="card"><button class="backlink" id="back">&larr; Back</button><h2 style="margin-bottom:6px;">Teacher dashboard</h2><p class="muted" style="margin:0 0 14px;">Enter the teacher passcode.</p><input type="password" id="pc" placeholder="Passcode" ${checking?'disabled':''} /><button class="btn" id="goBtn" ${checking?'disabled':''}>${goBtnInner}</button><div id="err"></div></div>`);
  c.querySelector('#back').onclick = ()=>{ STATE.screen='login'; render(); };
  const pcInput = c.querySelector('#pc');
  if(!checking){
    const tryAuth = ()=> teacherLogin(pcInput.value);
    pcInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryAuth(); });
    c.querySelector('#goBtn').onclick = tryAuth;
    setTimeout(()=>pcInput.focus(), 0);
  }
  if(STATE.teacherError) c.querySelector('#err').appendChild(el(`<p class="error-text">${STATE.teacherError}</p>`));
  return c;
}

async function teacherLogin(passcode){
  STATE.loading=true; render();
  const resp = await postJSON('/api/teacher/roster', { passcode });
  STATE.loading=false;
  if(!Array.isArray(resp)){ STATE.teacherError='Wrong passcode.'; render(); return; }
  STATE.teacherAuthed = true;
  STATE.teacherRows = resp;
  STATE.teacherError = '';
  STATE.teacherPasscode = passcode;
  render();
}

render();
</script>
