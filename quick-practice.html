<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quick Math Practice</title>
<style>
:root{--ink:#201e1d;--paper:#fffaf0;--line:#d8c7ad;--cream:#fdf3e3;--blue:#2f6fed;--blue-d:#1d4fb5;--orange:#e8741a;--orange-d:#b55610;--green:#2f8a3a;--red:#c0392b;--w:clamp(38px,9.4vw,76px);--sep:clamp(12px,2.4vw,22px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:20px;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:1.5em;margin:0;line-height:1.2}
.std{display:inline-block;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.7em;font-weight:700;margin-top:4px}
.key{background:#fff3b0;border:3px solid #e6c200;border-radius:16px;padding:10px 16px;font-weight:700;margin:12px 0}
.key b{display:block;font-size:.7em;letter-spacing:.06em;text-transform:uppercase;color:#7a6200}
.dots{display:flex;gap:8px;margin:10px 0}
.dots i{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dots i.done{background:var(--green);border-color:var(--green)}
.dots i.now{border-color:var(--blue);background:#cfe0ff}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.hide{display:none!important}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;min-height:48px;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #c67139;outline-offset:2px}
button.div{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
button.div:active{box-shadow:0 1px 0 var(--orange-d)}
button.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.go{background:var(--green);box-shadow:0 4px 0 #1e5e27}
button.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:none;margin:8px 0;font-size:1em}
button.opt.bad{border-color:var(--red);background:#fbe3e0;opacity:.7}
button.opt.good{border-color:var(--green);background:#e7f6e7}
/* chart */
.chart-wrap{overflow-x:auto}
.chart{position:relative;width:calc(var(--w)*9 + var(--sep));margin:0 auto}
.row{display:flex}
.hd{width:var(--w);text-align:center;font-size:clamp(8px,1.55vw,13px);font-weight:800;line-height:1.15;padding:2px 1px;background:var(--cream);border:2px solid var(--line);border-bottom:0;display:flex;align-items:center;justify-content:center;min-height:42px;overflow-wrap:anywhere;hyphens:auto}
.hd.dec{background:#e8f1ff}
.cell{width:var(--w);height:calc(var(--w)*1.15);border:2px solid var(--line);background:#fff}
.sep{width:var(--sep);display:flex;align-items:flex-end;justify-content:center;font-size:1.6em;font-weight:900;color:var(--ink);line-height:.6}
.sep.hd0{align-items:center;background:transparent}
.tiles{position:absolute;left:0;right:0;top:44px;height:calc(var(--w)*1.15);pointer-events:none}
.tile,.ghost0{position:absolute;top:3px;width:var(--w);height:calc(var(--w)*1.15 - 6px);display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.72);font-weight:900;color:#fff;border-radius:12px;transition:left .8s cubic-bezier(.3,.8,.3,1)}
.tile{margin:0 3px;width:calc(var(--w) - 6px)}
.ghost0{margin:0 3px;width:calc(var(--w) - 6px);background:transparent;color:#bbb;border:3px dashed #ccc;opacity:0;transition:opacity .5s}
.ghost0.on{opacity:1}
.eq{font-size:1.7em;font-weight:900;text-align:center;margin:12px 0 2px;min-height:1.4em}
.say{text-align:center;font-weight:700;min-height:1.5em;color:#444}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-weight:700}
.chips button{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;min-height:42px}
.chips button.on{background:var(--ink);color:#fff}
.q{font-size:1.15em;font-weight:800;margin:0 0 8px}
input.ans{font:inherit;font-size:1.3em;width:150px;min-height:52px;text-align:center;border:3px solid var(--line);border-radius:12px;padding:6px 10px}
.fb{min-height:2.7em;margin:10px 0;font-weight:700}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.big{font-size:2.2em;text-align:center}
table.ref{border-collapse:collapse;width:100%;font-size:.9em}
table.ref th,table.ref td{text-align:left;padding:6px 10px;border-bottom:2px solid var(--line)}
table.ref th{background:var(--cream)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.ghost0{transition:none}}
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<script>
// Quick Math Practice: one reusable page. The day's topic is a JSON file in activities/quick/.
// Open it as quick-practice.html?t=<file name without .json>  (default: powers-of-10-decimals)
(function(){
'use strict';
var app = document.getElementById('app');
var topic = (new URLSearchParams(location.search).get('t') || 'powers-of-10-decimals').replace(/[^a-z0-9-]/gi,'');
fetch('activities/quick/' + topic + '.json').then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(start)
  .catch(function(){ app.innerHTML = '<p>Could not load this activity. Ask your teacher for the link.</p>'; });

function h(tag, attrs, kids){
  var e = document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(k){
    if(k==='class') e.className = attrs[k];
    else if(k==='text') e.textContent = attrs[k];
    else if(k.slice(0,2)==='on') e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function fmtNum(n){ return n.toLocaleString('en-US'); }

/* ---------- Place-value chart (digits slide when you multiply or divide by 10, 100, 1,000) ---------- */
var TOP = 4, BOT = -4; // columns 10^4 ... 10^-4
var COLS = ['Ten thousands','Thousands','Hundreds','Tens','Ones','Tenths','Hundredths','Thousandths','Ten-thousandths'];
var COLORS = ['#e63946','#f4a300','#2a9d8f','#3a86ff','#8338ec','#d6336c','#2b8a3e','#e8590c'];

function makeChart(){
  var wrap = h('div',{class:'chart-wrap'});
  var chart = h('div',{class:'chart'});
  var hdr = h('div',{class:'row'}), body = h('div',{class:'row'}), tilesEl = h('div',{class:'tiles'});
  COLS.forEach(function(name,i){
    hdr.appendChild(h('div',{class:'hd'+(i>=5?' dec':''),text:name}));
    body.appendChild(h('div',{class:'cell'}));
    if(i===4){ hdr.appendChild(h('div',{class:'sep hd0'})); body.appendChild(h('div',{class:'sep',text:'.'})); }
  });
  chart.appendChild(hdr); chart.appendChild(body); chart.appendChild(tilesEl); wrap.appendChild(chart);
  var eq = h('div',{class:'eq','aria-live':'polite'}), say = h('div',{class:'say'});
  var btns = h('div',{class:'btns'});
  var ops = [{k:1,t:'× 10'},{k:2,t:'× 100'},{k:3,t:'× 1,000'},{k:-1,t:'÷ 10'},{k:-2,t:'÷ 100'},{k:-3,t:'÷ 1,000'}];
  var opEls = ops.map(function(o){
    var b = h('button',{class:o.k<0?'div':'',type:'button',text:o.t,'aria-label':(o.k>0?'Multiply by ':'Divide by ')+fmtNum(Math.pow(10,Math.abs(o.k)))});
    b.onclick = function(){ shift(o); };
    btns.appendChild(b);
    return b;
  });
  var reset = h('button',{class:'ghost',type:'button',text:'↺ Start over'});
  reset.onclick = function(){ setNumber(startStr); };
  btns.appendChild(reset);
  var ghosts = {};
  for(var e=TOP;e>=BOT;e--){ var g = h('div',{class:'ghost0',text:'0'}); g.style.left = leftFor(e); ghosts[e] = g; tilesEl.appendChild(g); }

  var tiles = [], startStr = '', net = 0, moves = 0, onMove = null;

  function leftFor(exp){ var col = TOP - exp; return 'calc(var(--w) * ' + col + ' + var(--sep) * ' + (col>4?1:0) + ')'; }
  function parse(str){
    var s = String(str).replace(/,/g,''), parts = s.split('.'), out = [];
    var ip = parts[0].replace(/^0+(?=\d)/,''); if(ip==='0') ip = '';
    for(var i=0;i<ip.length;i++) out.push({d:ip[i], exp:ip.length-1-i});
    var fp = parts[1] || '';
    for(var j=0;j<fp.length;j++) out.push({d:fp[j], exp:-(j+1)});
    return out;
  }
  function reading(){
    var hi = Math.max.apply(null, tiles.map(function(t){return t.exp;}).concat(0));
    var lo = Math.min.apply(null, tiles.map(function(t){return t.exp;}).concat(0));
    var ip = '', fp = '';
    for(var e=hi;e>=lo;e--){
      var t = tiles.filter(function(x){return x.exp===e;})[0], d = t ? t.d : '0';
      if(e>=0) ip += d; else fp += d;
    }
    if(ip==='') ip = '0';
    var n = ip.length>3 ? ip.replace(/\B(?=(\d{3})+(?!\d))/g,',') : ip;
    return fp ? n + '.' + fp : n;
  }
  function place(){
    tiles.forEach(function(t){ t.el.style.left = leftFor(t.exp); });
    var hi = Math.max.apply(null, tiles.map(function(t){return t.exp;}).concat(0));
    var lo = Math.min.apply(null, tiles.map(function(t){return t.exp;}).concat(0));
    for(var e=TOP;e>=BOT;e--){
      var occupied = tiles.some(function(t){return t.exp===e;});
      ghosts[e].classList.toggle('on', !occupied && e<=hi && e>=lo);
    }
    opEls.forEach(function(b,i){
      var k = ops[i].k;
      var ok = tiles.every(function(t){ return t.exp+k<=TOP && t.exp+k>=BOT; });
      b.disabled = !ok; b.title = ok ? '' : 'Too big for this chart';
    });
    var cur = reading();
    var op = net>0 ? ' × ' + fmtNum(Math.pow(10,net)) : net<0 ? ' ÷ ' + fmtNum(Math.pow(10,-net)) : '';
    eq.textContent = op ? fmtNum2(startStr) + op + ' = ' + cur : cur;
  }
  function fmtNum2(s){ return String(s).replace(/,/g,'').replace(/^(\d+)(\.\d+)?$/,function(m,a,b){ return (a.length>3?a.replace(/\B(?=(\d{3})+(?!\d))/g,','):a)+(b||''); }); }
  function setNumber(str){
    startStr = String(str); net = 0; moves = 0;
    tilesEl.querySelectorAll('.tile').forEach(function(n){ n.remove(); });
    tiles = parse(startStr).map(function(t,i){
      var el = h('div',{class:'tile',text:t.d}); el.style.background = COLORS[i%COLORS.length]; el.style.left = leftFor(t.exp);
      tilesEl.appendChild(el); t.el = el; return t;
    });
    say.textContent = '';
    place();
  }
  function shift(o){
    tiles.forEach(function(t){ t.exp += o.k; });
    net += o.k; moves++;
    var n = Math.abs(o.k);
    say.textContent = o.t + ': every digit moves ' + n + ' place' + (n>1?'s':'') + (o.k>0 ? ' to the LEFT ⬅️' : ' to the RIGHT ➡️');
    place();
    if(onMove) onMove(reading(), moves);
  }
  return {
    wrap: wrap, eq: eq, say: say, btns: btns, setNumber: setNumber, reading: reading,
    moves: function(){ return moves; },
    onMove: function(f){ onMove = f; }
  };
}

/* ---------- The activity ---------- */
function start(cfg){
  document.title = cfg.title + ' – Quick Practice';
  var steps = [{kind:'explore'}].concat(cfg.questions.map(function(q){return {kind:'q',q:q};}));
  if(cfg.final) steps.push({kind:'q',q:cfg.final,final:true});
  var idx = 0, firstTry = 0, askCount = steps.filter(function(s){return s.kind==='q';}).length;
  var hasChart = cfg.model && cfg.model.type === 'place-value-shift';
  var chart = hasChart ? makeChart() : null;

  var dots = h('div',{class:'dots','aria-hidden':'true'});
  var chartCard = h('div',{class:'card'});
  var panel = h('div',{class:'card'});
  if(hasChart){ chartCard.appendChild(chart.wrap); chartCard.appendChild(chart.eq); chartCard.appendChild(chart.say); chartCard.appendChild(chart.btns); }
  var chips = h('div',{class:'chips'});
  chartCard.appendChild(chips);

  app.innerHTML = '';
  app.appendChild(h('h1',{text:cfg.title}));
  app.appendChild(h('span',{class:'std',text:cfg.standards||''}));
  app.appendChild(h('div',{class:'key'},[h('b',{text:'Key idea'}), document.createTextNode(cfg.keyIdea)]));
  if(cfg.table){
    var tb = h('table',{class:'ref'}), hr = h('tr');
    cfg.table.headers.forEach(function(t){ hr.appendChild(h('th',{text:t})); });
    tb.appendChild(hr);
    cfg.table.rows.forEach(function(r){ var tr = h('tr'); r.forEach(function(c){ tr.appendChild(h('td',{text:c})); }); tb.appendChild(tr); });
    app.appendChild(h('div',{class:'card'},[tb]));
  }
  app.appendChild(dots);
  if(hasChart) app.appendChild(chartCard);
  app.appendChild(panel);
  render();

  function drawDots(){
    dots.innerHTML = '';
    steps.forEach(function(s,i){ dots.appendChild(h('i',{class:i<idx?'done':i===idx?'now':''})); });
  }
  function render(){
    drawDots(); panel.innerHTML = '';
    if(idx>=steps.length) return finish();
    var s = steps[idx];
    if(s.kind==='explore') return explore();
    question(s);
  }
  function explore(){
    if(hasChart){
      chartCard.classList.remove('hide');
      var nums = cfg.model.numbers || ['3.4'];
      chart.setNumber(nums[0]);
      chips.innerHTML = ''; chips.appendChild(h('span',{text:'Try a number:'}));
      nums.forEach(function(n,i){
        var b = h('button',{type:'button',text:n,class:i===0?'on':''});
        b.onclick = function(){ chips.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); chart.setNumber(n); };
        chips.appendChild(b);
      });
    }
    panel.appendChild(h('p',{class:'q',text:(cfg.model && cfg.model.explore) || 'Look at the key idea. Then start!'}));
    var go = h('button',{class:'go',type:'button',text:'Start the questions →'});
    if(hasChart){
      go.disabled = true;
      var note = h('p',{class:'say',text:'Tap 2 buttons to unlock the questions.'});
      panel.appendChild(note);
      chart.onMove(function(v,m){ if(m>=2){ go.disabled = false; note.textContent = 'Nice! Ready?'; } });
    }
    go.onclick = function(){ idx++; render(); };
    panel.appendChild(go);
  }
  function question(s){
    var q = s.q, attempts = 0, solved = false;
    var qNum = steps.slice(0,idx+1).filter(function(x){return x.kind==='q';}).length;
    if(hasChart){
      chips.innerHTML = '';
      if(q.chart && q.chart.start){ chartCard.classList.remove('hide'); chart.setNumber(q.chart.start); }
      else chartCard.classList.add('hide');
      chart.onMove(null);
    }
    panel.appendChild(h('p',{class:'q',text:(s.final?'⭐ ':'Question '+qNum+' of '+askCount+': ')+q.q}));
    var fb = h('div',{class:'fb','aria-live':'polite'});
    var next = h('button',{class:'go hide',type:'button',text: idx===steps.length-1 ? 'Finish ✔' : 'Next →'});
    next.onclick = function(){ idx++; render(); };
    function win(first){
      if(solved) return; solved = true;
      if(first) firstTry++;
      fb.className = 'fb ok'; fb.textContent = '✅ ' + (first?'Yes! ':'You got it! ') + (q.why||'');
      next.classList.remove('hide'); next.focus();
    }
    function miss(){
      attempts++;
      fb.className = 'fb no';
      fb.textContent = '❌ Not yet. Try again! ' + (q.hint ? '💡 Hint: ' + q.hint : '');
    }
    if(q.type==='choice'){
      q.options.forEach(function(o,i){
        var b = h('button',{class:'opt',type:'button',text:o});
        b.onclick = function(){
          if(solved) return;
          if(i===q.answer){ b.classList.add('good'); panel.querySelectorAll('.opt').forEach(function(x){x.disabled=true;}); win(attempts===0); }
          else { b.classList.add('bad'); b.disabled = true; miss(); }
        };
        panel.appendChild(b);
      });
    } else if(q.type==='number'){
      var inp = h('input',{class:'ans',type:'text',inputmode:'decimal',autocomplete:'off','aria-label':'Your answer'});
      var chk = h('button',{type:'button',text:'Check'});
      var tryCheck = function(){
        if(solved) return;
        var v = inp.value.replace(/[,\s]/g,'');
        if(v==='') return;
        var ok = q.answer.some(function(a){ return Number(a)===Number(v) && !isNaN(Number(v)); });
        if(ok){ inp.disabled = chk.disabled = true; win(attempts===0); }
        else {
          miss();
          if(attempts>=3){ fb.textContent = '👀 The answer is ' + q.answer[0] + '. ' + (q.why||''); solved = true; inp.disabled = chk.disabled = true; next.classList.remove('hide'); }
          else { inp.select(); }
        }
      };
      chk.onclick = tryCheck;
      inp.onkeydown = function(e){ if(e.key==='Enter') tryCheck(); };
      panel.appendChild(h('div',{style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap'},[inp,chk]));
      setTimeout(function(){ inp.focus(); },0);
    } else if(q.type==='move'){
      panel.appendChild(h('p',{class:'say',text:'Goal: make the chart show ' + q.target + '.'}));
      chart.onMove(function(v,m){
        if(solved) return;
        if(v.replace(/,/g,'')===String(q.target).replace(/,/g,'')) win(m<=(q.par||2));
        else if(m%3===0) miss();
      });
    }
    panel.appendChild(fb); panel.appendChild(next);
  }
  function finish(){
    if(hasChart) chartCard.classList.add('hide');
    panel.appendChild(h('div',{class:'big',text:'🎉⭐🎉'}));
    panel.appendChild(h('p',{class:'q',text:'All done! You got ' + firstTry + ' of ' + askCount + ' right on the first try.'}));
    panel.appendChild(h('p',{text:'Remember: ' + cfg.keyIdea}));
    var again = h('button',{class:'ghost',type:'button',text:'↺ Try again'});
    again.onclick = function(){ idx = 0; firstTry = 0; render(); };
    panel.appendChild(again);
  }
}
})();
</script>
</body>
</html>
