<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="100%" role="img">
<rect x="2" y="2" width="636" height="226" rx="16" fill="#fdf3e3" stroke="#d8c7ad" stroke-width="3"/>
<text x="320" y="38" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#8a4520" text-anchor="middle">WORKED EXAMPLE 5: Not the same thing!</text>
<text x="320" y="95" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#555" text-anchor="middle">10 × 3 = 30   (add 10 three times)</text>
<text x="320" y="145" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#555" text-anchor="middle">10³ = 10 × 10 × 10 = 1,000</text>
<text x="320" y="200" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#c67139" text-anchor="middle">An exponent is NOT multiplication by that number.</text>
</svg>
