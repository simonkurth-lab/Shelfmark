<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="100%" role="img">
<rect x="2" y="2" width="636" height="326" rx="16" fill="#fdf3e3" stroke="#d8c7ad" stroke-width="3"/>
<text x="320" y="34" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#8a4520" text-anchor="middle">POWERS OF 10 AND DECIMAL PLACE VALUE</text>
<text x="320" y="62" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#201e1d" text-anchor="middle">Every place is 10 times the place to its right</text>
<text x="320" y="82" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#201e1d" text-anchor="middle">and one-tenth the place to its left.</text>
<text x="30" y="120" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#8a4520">Operation</text>
<text x="150" y="120" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#8a4520">Example</text>
<text x="350" y="120" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#8a4520">What happens?</text>
<line x1="20" y1="130" x2="620" y2="130" stroke="#201e1d" stroke-width="2"/>
<text x="30" y="165" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#201e1d">× 10</text>
<text x="150" y="165" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">3.25 → 32.5</text>
<text x="350" y="165" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">Digits shift left 1 place</text>
<line x1="20" y1="179" x2="620" y2="179" stroke="#d8c7ad" stroke-width="2"/>
<text x="30" y="210" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#201e1d">× 100</text>
<text x="150" y="210" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">3.25 → 325</text>
<text x="350" y="210" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">Digits shift left 2 places</text>
<line x1="20" y1="224" x2="620" y2="224" stroke="#d8c7ad" stroke-width="2"/>
<text x="30" y="255" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#201e1d">÷ 10</text>
<text x="150" y="255" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">3.25 → 0.325</text>
<text x="350" y="255" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">Digits shift right 1 place</text>
<line x1="20" y1="269" x2="620" y2="269" stroke="#d8c7ad" stroke-width="2"/>
<text x="30" y="300" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#201e1d">÷ 100</text>
<text x="150" y="300" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">3.25 → 0.0325</text>
<text x="350" y="300" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#201e1d">Digits shift right 2 places</text>
<line x1="20" y1="314" x2="620" y2="314" stroke="#d8c7ad" stroke-width="2"/>
</svg>
