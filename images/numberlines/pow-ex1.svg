<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="100%" role="img">
<rect x="2" y="2" width="636" height="226" rx="16" fill="#fdf3e3" stroke="#d8c7ad" stroke-width="3"/>
<text x="320" y="38" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#8a4520" text-anchor="middle">WORKED EXAMPLE 1: Base and exponent</text>
<text x="320" y="120" font-family="Helvetica,Arial,sans-serif" font-size="80" font-weight="800" fill="#201e1d" text-anchor="middle">10³</text>
<line x1="280" y1="135" x2="280" y2="165" stroke="#c67139" stroke-width="3"/>
<text x="250" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#c67139" text-anchor="end">base = 10</text>
<line x1="368" y1="70" x2="395" y2="55" stroke="#c67139" stroke-width="3"/>
<text x="402" y="58" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#c67139" text-anchor="start">exponent = 3</text>
<text x="320" y="218" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#201e1d" text-anchor="middle">The exponent says: write the base 3 times and multiply.</text>
</svg>
