<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="100%" role="img">
<rect x="2" y="2" width="636" height="346" rx="16" fill="#fdf3e3" stroke="#d8c7ad" stroke-width="3"/>
<text x="320" y="36" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#8a4520" text-anchor="middle">WORKED EXAMPLE 3: The zeros pattern</text>
<text x="120" y="72" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#8a4520" text-anchor="middle">Power</text>
<text x="320" y="72" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#8a4520" text-anchor="middle">Number</text>
<text x="520" y="72" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#8a4520" text-anchor="middle">Zeros</text>
<text x="120" y="112" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10¹</text>
<text x="320" y="112" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10</text>
<text x="520" y="112" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#c67139" text-anchor="middle">1 zero</text>
<text x="120" y="152" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10²</text>
<text x="320" y="152" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">100</text>
<text x="520" y="152" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#c67139" text-anchor="middle">2 zeros</text>
<text x="120" y="192" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10³</text>
<text x="320" y="192" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">1,000</text>
<text x="520" y="192" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#c67139" text-anchor="middle">3 zeros</text>
<text x="120" y="232" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10⁴</text>
<text x="320" y="232" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10,000</text>
<text x="520" y="232" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#c67139" text-anchor="middle">4 zeros</text>
<text x="120" y="272" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">10⁵</text>
<text x="320" y="272" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#201e1d" text-anchor="middle">100,000</text>
<text x="520" y="272" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#c67139" text-anchor="middle">5 zeros</text>
<text x="320" y="330" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#2f7a2f" text-anchor="middle">The exponent = the number of zeros!</text>
</svg>
