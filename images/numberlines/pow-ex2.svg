<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="100%" role="img">
<rect x="2" y="2" width="636" height="246" rx="16" fill="#fdf3e3" stroke="#d8c7ad" stroke-width="3"/>
<text x="320" y="38" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#8a4520" text-anchor="middle">WORKED EXAMPLE 2: Expanding a power</text>
<text x="320" y="95" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#201e1d" text-anchor="middle">10³  =  10 × 10 × 10</text>
<text x="320" y="140" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#555" text-anchor="middle">10 × 10 = 100</text>
<text x="320" y="180" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#555" text-anchor="middle">100 × 10 = 1,000</text>
<text x="320" y="225" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#2f7a2f" text-anchor="middle">So 10³ = 1,000</text>
</svg>
