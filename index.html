<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelfmark — Let's Read!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=optional" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --ink:#2B2118; --forest:#2F5D50; --forest-dark:#1F423A;
    --coral:#E8734A; --gold:#D9A441; --card:#FFFFFF; --line:#E7DFCE; --muted:#7A7160;
    --night-a:#1F423A; --night-b:#1B2A4A; --night-c:#141B36;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}
  a{text-decoration:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;width:100%;}

  /* ---- Nav ---- */
  .nav{display:flex;align-items:center;padding:24px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(160deg,var(--forest),var(--forest-dark));display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Baloo 2';font-weight:800;font-size:17px;flex:none;}
  .brand-name{font-size:21px;color:var(--forest-dark);}

  /* ---- Hero ---- */
  .hero{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:20px 0 56px;}
  .hero h1{font-size:44px;line-height:1.14;color:var(--forest-dark);}
  .hero h1 .accent{color:var(--coral);}
  .hero p{font-size:17px;color:var(--muted);line-height:1.6;margin:18px 0 28px;max-width:440px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Nunito';font-weight:800;font-size:18px;padding:16px 34px;border-radius:14px;cursor:pointer;border:none;background:var(--coral);color:#fff;}
  .btn:hover{background:#cf5f38;}

  .hero-art{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:1/0.82;background:linear-gradient(150deg,var(--night-a) 0%, var(--night-b) 55%, var(--night-c) 100%);}
  .hero-art .star{position:absolute;background:var(--gold);border-radius:50%;opacity:.85;animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  .hero-art .moon{position:absolute;top:28px;right:34px;width:46px;height:46px;border-radius:50%;background:var(--gold);box-shadow:0 0 40px 6px rgba(217,164,65,0.35);}
  .hero-tree{position:absolute;bottom:0;left:0;right:0;}
  .hero-caption{position:absolute;left:22px;bottom:18px;color:#fff;font-family:'Baloo 2';font-weight:700;font-size:15px;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.4);}

  footer{text-align:center;padding:0 0 32px;color:var(--muted);font-size:12.5px;}

  @media (max-width: 860px){
    .hero{grid-template-columns:1fr;padding-bottom:36px;}
    .hero h1{font-size:32px;}
    .hero p{max-width:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav">
    <div class="brand"><div class="mark">S</div><div class="brand-name">Shelfmark</div></div>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h1>Ready for your next reading <span class="accent">adventure</span>?</h1>
      <p>Pick a book, read the whole thing, then come tell us about it. Earn points and badges along the way!</p>
      <a href="app.html"><button class="btn">Start Reading</button></a>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="moon"></div>
      <div class="star" style="top:18%;left:12%;width:4px;height:4px;"></div>
      <div class="star" style="top:32%;left:30%;width:3px;height:3px;animation-delay:.4s;"></div>
      <div class="star" style="top:14%;left:55%;width:3px;height:3px;animation-delay:.9s;"></div>
      <div class="star" style="top:46%;left:75%;width:4px;height:4px;animation-delay:1.3s;"></div>
      <div class="star" style="top:22%;left:82%;width:3px;height:3px;animation-delay:.6s;"></div>
      <svg class="hero-tree" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" style="width:100%;height:62%;">
        <path d="M0 300 Q80 210 160 260 Q220 190 260 250 Q320 200 400 260 L400 300 Z" fill="#0F1A33" opacity="0.9"/>
        <g transform="translate(150,150)">
          <path d="M40 150 C30 90 30 60 40 20" stroke="#3A2A1E" stroke-width="10" fill="none" stroke-linecap="round"/>
          <circle cx="40" cy="0" r="55" fill="#2F5D50"/>
          <circle cx="0" cy="20" r="40" fill="#2A5347"/>
          <circle cx="80" cy="25" r="42" fill="#2A5347"/>
          <rect x="20" y="30" width="46" height="34" rx="4" fill="#D9A441" opacity="0.9"/>
          <rect x="34" y="42" width="12" height="18" fill="#1F423A"/>
          <circle cx="30" cy="42" r="3" fill="#FBF6EC"/>
          <circle cx="58" cy="42" r="3" fill="#FBF6EC"/>
        </g>
      </svg>
      <div class="hero-caption">Reading is the best kind of adventure. 🌙</div>
    </div>
  </section>

  <footer>Shelfmark — made for kids who love to read.</footer>
</div>

</body>
</html>
